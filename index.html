<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b4bdb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<title>N'EPS · Visites stagiaires</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stagiaires">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#fff6e5;--card:#fff;--ink:#1f2544;--mute:#62668a;--line:#1f2544;--soft:#f3ead6;--accent:#5b4bdb;--yellow:#ffd43b;
  --pem:#7c6cf2;--echauf:#ffb020;--be:#ff8a3d;--sit:#1fc28b;--bi:#2fb5f0;--bf:#ff4f7b;
  --fort:#1fa463;--vig:#f07a1a;--secu:#e53935;--conseil:#2f6df0;--obs:#62668a;
  --r:18px;--bw:2.5px;--sh:4px 4px 0 var(--ink);--shs:2px 2px 0 var(--ink);
  --fh:"Fredoka","Baloo 2","Comic Sans MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600;background:var(--bg);background-image:radial-gradient(#efdcb8 1.3px,transparent 1.5px);background-size:22px 22px;color:var(--ink);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:var(--bw) solid var(--ink);background:#fff;border-radius:14px;padding:7px 14px;min-height:42px;font-weight:800;box-shadow:var(--shs);transition:transform .08s,box-shadow .08s,background .15s;white-space:nowrap}
button:hover{background:#fffbea;transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button.pri{background:var(--accent);color:#fff}
button.pri:hover{background:#6b5cf0}
button.hot{background:var(--bf);color:#fff}
button.hot:hover{background:#ff6a90}
button.yel{background:var(--yellow)}
button.ghost{border-color:transparent;background:transparent;box-shadow:none}
button.ghost:hover{background:rgba(31,37,68,.07);box-shadow:none;transform:none}
button.danger{color:var(--secu)}
button.sm{min-height:34px;padding:3px 10px;font-size:13px;border-radius:11px;border-width:2px}
input,select,textarea{border:2px solid var(--ink);border-radius:12px;padding:9px 11px;background:#fff;width:100%;font-weight:600;box-shadow:inset 2px 2px 0 rgba(31,37,68,.07)}
textarea{resize:vertical;min-height:110px;line-height:1.5}
input:focus,select:focus,textarea:focus,[contenteditable]:focus{outline:3px solid var(--yellow);outline-offset:1px}
label{font-family:var(--fh);font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;display:block;margin:12px 0 4px}
h1,h2,h3{margin:0;font-family:var(--fh);font-weight:700}
a{color:var(--accent);font-weight:800}
.muted{color:var(--mute)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 9px;border-radius:999px;background:#ece8ff;color:var(--ink);font-weight:800;white-space:nowrap;border:2px solid var(--ink)}
.hidden{display:none!important}
.lbl{display:inline}

/* ---------- Top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;padding:8px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:3px solid var(--ink);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0 14px,transparent 14px 28px)}
.top button:not(.pri):not(.hot):not(.yel){background:#fff;color:var(--ink)}
.brand{font-family:var(--fh);font-weight:700;font-size:23px;letter-spacing:.01em;display:flex;align-items:center;gap:10px;text-shadow:2px 2px 0 var(--ink)}
.brand small{font-weight:500;font-size:16px;opacity:.9;text-shadow:none}
.brand img{width:40px;height:40px;border-radius:12px;border:2.5px solid var(--ink);box-shadow:var(--shs);transform:rotate(-5deg);background:#fff}
.ctx{font-family:var(--fh);font-weight:600;font-size:19px;line-height:1.15;text-shadow:1.5px 1.5px 0 var(--ink)}
.ctx small{display:block;font-family:"Nunito",sans-serif;font-weight:700;opacity:.9;font-size:13px;text-shadow:none}
.ctx a{color:var(--yellow)}
.chrono{display:flex;align-items:center;gap:6px;background:var(--yellow);color:var(--ink);border:var(--bw) solid var(--ink);border-radius:18px;padding:4px 6px 4px 14px;box-shadow:var(--shs)}
.chrono.run{background:#7cf2b4;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:2px 2px 0 var(--ink),0 0 0 6px rgba(124,242,180,.35)}}
.chrono .t{font-family:var(--fh);font-variant-numeric:tabular-nums;font-size:28px;font-weight:700;min-width:96px;text-align:center}
.chrono button{min-height:36px;padding:3px 10px;box-shadow:none;border-width:2px}
.chrono button:hover{box-shadow:none;transform:none}
.mins{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.mins button{min-width:64px;font-family:var(--fh);font-size:17px}
.mins input{width:90px}
.measure.on{background:var(--bf)!important;color:#fff!important}

/* ---------- Home ---------- */
.wrap{padding:22px 28px 60px}
.hero{display:flex;align-items:center;gap:18px;margin-bottom:20px;background:#fff;border:var(--bw) solid var(--ink);border-radius:24px;box-shadow:var(--sh);padding:14px 20px;background-image:radial-gradient(circle at 92% 30%,#fff1b8 0 70px,transparent 71px),radial-gradient(circle at 80% 110%,#e3ddff 0 60px,transparent 61px)}
.hero h2{font-size:30px}
.hero p{margin:2px 0 0}
.hero svg{flex:none}
.stats{display:flex;gap:10px}
.stat{border:2px solid var(--ink);border-radius:14px;padding:4px 12px;text-align:center;background:var(--soft);box-shadow:var(--shs)}
.stat b{display:block;font-family:var(--fh);font-size:24px;line-height:1}
.stat span{font-size:11px;text-transform:uppercase;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:22px}
.card{background:var(--card);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.tcard{position:relative}
.tcard h3{font-size:21px}
.av{width:50px;height:50px;border-radius:50%;border:var(--bw) solid var(--ink);display:grid;place-items:center;font-family:var(--fh);font-weight:700;font-size:20px;color:#fff;text-shadow:1.5px 1.5px 0 var(--ink);box-shadow:var(--shs);flex:none}
.axe{border:2px solid var(--ink);border-left:8px solid var(--bf);background:#ffe8ee;border-radius:12px;padding:6px 10px;margin:6px 0;font-size:14px}
.hist{margin-top:12px;border-top:2.5px dashed var(--ink);padding-top:8px}
.hist .h{display:flex;align-items:center;gap:6px;padding:5px 6px;font-size:14px;border-radius:10px}
.hist .h:hover{background:var(--soft)}
.hist .h span{flex:1}
.empty{text-align:center;padding:40px;color:var(--mute)}

/* ---------- Obs layout ---------- */
.banner{background:#fff;border-bottom:3px solid var(--ink);padding:6px 16px 8px}
.banner .bt{font-family:var(--fh);font-size:15px;color:#d61f55;letter-spacing:.02em}
.axgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:8px;margin-top:4px}
.banner .ax{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:5px 8px 5px 10px;border:2px solid var(--ink);border-radius:14px;background:#fff0f4}
.banner .ax{flex-wrap:nowrap}
.banner .ax .txt{flex:1;min-width:0;font-size:14px;line-height:1.3}
.banner .ax .txt .chip{display:block;width:max-content;max-width:100%;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.banner .ax .seg button{padding:3px 8px;font-size:12px}
.banner .ax{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"txt q btn" "txt seg seg";gap:5px 10px;align-items:center}
.banner .ax .txt{grid-area:txt}.banner .ax .axq{grid-area:q}.banner .ax .step{grid-area:btn}.banner .ax .seg{grid-area:seg;justify-self:end}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff;box-shadow:var(--shs)}
.seg button{border:0;border-radius:0;min-height:32px;padding:3px 10px;font-size:12.5px;border-right:2px solid var(--ink);box-shadow:none}
.seg button:hover{transform:none;box-shadow:none;background:var(--soft)}
.seg button:active{transform:none}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;padding:16px}
.nav{display:flex;flex-direction:column;gap:8px;padding:2px 6px 6px 2px}
.nav .it{display:flex;align-items:center;gap:8px;text-align:left;padding:8px 10px 8px 22px;justify-content:flex-start;white-space:normal;background:linear-gradient(90deg,var(--c,#c9ccd9) 0 12px,#fff 12px);position:relative}
.nav .it.on{background:var(--c,#c9ccd9);transform:translateX(4px);box-shadow:var(--sh)}
.nav .it .n{flex:1;line-height:1.2;font-family:var(--fh);font-weight:600;font-size:15.5px}
.nav .it small{display:block;font-family:"Nunito",sans-serif;font-size:11.5px;font-weight:700;opacity:.75}
.nav .it .cnt{font-size:12px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 7px;font-weight:800}
.nav hr{border:0;border-top:2.5px dashed var(--ink);margin:6px 0;opacity:.5}
.main{min-width:0;padding:2px 8px 90px 2px}
.fhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--c);border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:8px 12px;margin-bottom:8px}
.fhead h2{font-size:24px}
.fhead input.title{font-family:var(--fh);font-size:24px;font-weight:700;border-color:transparent;background:transparent;box-shadow:none;padding:2px 6px;width:auto;flex:1;min-width:150px}
.fhead input.title:hover{border-color:var(--ink);background:rgba(255,255,255,.5)}
.timing{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;margin:0 0 0 14px}
.sec{background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);padding:14px;margin-bottom:16px;box-shadow:var(--sh);position:relative}
.sec>h4{display:inline-block;margin:-26px 0 8px -4px;font-family:var(--fh);font-weight:600;font-size:15px;background:var(--yellow);border:2px solid var(--ink);border-radius:10px;padding:1px 12px;transform:rotate(-2deg);box-shadow:var(--shs)}
.sec{margin-top:18px}
.kinds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.kinds button{min-height:36px;padding:3px 11px;font-size:13.5px;color:var(--kc);border-width:2px}
.kinds button.on{background:var(--kc);color:#fff;transform:translate(2px,2px);box-shadow:none}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1;min-width:220px}
.addrow select{width:auto;max-width:210px}
.items{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.item{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:14px;background:#fff;border:2px solid var(--ink);border-left:9px solid var(--k);box-shadow:var(--shs)}
.item .ic{font-size:18px;line-height:1.35}
.item .tx{flex:1;line-height:1.45;min-height:1.4em;white-space:pre-wrap}
.item select{width:auto;font-size:12px;padding:2px 4px;border-radius:8px;box-shadow:none}
.item.conseil{background:#e8f0ff;border-radius:20px 20px 20px 4px;border-left-width:2px}
.item button{min-height:28px;padding:0 8px}
.fgrid{display:block}
.drawph{width:100%;min-height:200px;border:3px dashed var(--ink);border-radius:16px;background:repeating-linear-gradient(45deg,#fff 0 12px,#fff8e1 12px 24px);font-family:var(--fh);font-size:20px;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.drawph span{font-size:44px}

/* ---------- Canvas ---------- */
.fieldsel{width:auto!important;min-height:40px;font-weight:800;font-size:14px}
.objbar{display:flex;flex-wrap:nowrap;gap:5px;margin:0 0 8px;align-items:center;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.objbar>*{flex:none}
.drawfull .objbar{flex-wrap:wrap;overflow:visible}
.ob{display:flex;flex-direction:column;align-items:center;gap:0;min-height:0;padding:3px 4px 2px;width:64px;border-width:2px;box-shadow:none;white-space:normal;font-size:10px;line-height:1.1;font-weight:800}
.ob img{width:36px;height:36px}
.ob span{min-height:22px;display:flex;align-items:center;text-align:center}
.ob.on{background:var(--yellow);box-shadow:var(--shs);transform:translate(-1px,-1px)}
.objz button{min-height:30px;padding:2px 9px}
.objhint{font-size:12.5px;margin:-4px 0 6px}
.drawfull{position:fixed!important;inset:0;z-index:45;margin:0!important;border-radius:0!important;overflow:auto;background:#fff8e8}
body.dfull .fgrid>.col.right{position:static}
body.dfull .fab,body.dfull .sign{display:none}
.drawfull>h4{display:none}
.drawfull .draw{width:min(100%,calc((100vh - 230px)*1.786));margin:0 auto}
.drawfull .objbar,.drawfull .tools{justify-content:center}
.draw{position:relative;width:100%;aspect-ratio:1000/560;border:var(--bw) solid var(--ink);border-radius:14px;overflow:hidden;touch-action:none;background:#fff;box-shadow:var(--shs)}
.draw canvas{position:absolute;inset:0;width:100%;height:100%}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.sw{width:36px;height:36px;min-height:36px;border-radius:50%;padding:0;border:2.5px solid var(--ink)}
.sw.on{transform:scale(1.15);box-shadow:0 0 0 3px var(--yellow),0 0 0 5px var(--ink)}
.sw.on:hover{transform:scale(1.15)}
.tools .sz.on,.tools .tl.on{background:var(--accent);color:#fff}
.tools select{width:auto;min-height:34px;padding:3px 8px;font-size:13px}

/* ---------- Competences ---------- */
.compgrid{display:grid;grid-template-columns:1fr;gap:10px}
.comp{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;padding:10px;border:2px solid var(--ink);border-radius:14px;background:#fff;box-shadow:var(--shs)}
.comp.set{background:#fffbea}
.comp .code{font-family:var(--fh);font-weight:700;background:var(--yellow);border:2px solid var(--ink);border-radius:10px;padding:1px 8px;text-align:center;min-width:52px}
.comp .lab{font-size:14px;line-height:1.3}
.comp .lv{grid-column:1/-1;justify-self:start}
.comp .ev{grid-column:1/-1;font-size:12.5px;color:var(--mute)}
.comp input{grid-column:1/-1;padding:6px 9px;font-size:14px}
.lv button.on[data-l="1"]{background:#e53935;color:#fff}
.lv button.on[data-l="2"]{background:#f07a1a;color:#fff}
.lv button.on[data-l="3"]{background:#1fa463;color:#fff}
.lv button.on[data-l="0"]{background:#9aa0b8;color:#fff}
.group{grid-column:1/-1;margin-top:10px;font-family:var(--fh);font-weight:600;font-size:16px}
.sgrid{display:block}
.axcard{border:var(--bw) solid var(--ink);border-left:10px solid var(--bf);border-radius:16px;padding:10px 12px;margin-bottom:10px;background:#fff;box-shadow:var(--shs)}

/* ---------- Drawer / modal / bubble ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:#fff;z-index:40;border-left:3px solid var(--ink);box-shadow:-8px 0 0 rgba(31,37,68,.18);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .25s}
.drawer.open{transform:none}
.drawer .dh{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:3px solid var(--ink);background:var(--yellow);font-family:var(--fh);font-size:17px}
.drawer iframe{flex:1;border:0;width:100%}
.modalbg{position:fixed;inset:0;background:rgba(43,32,120,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;backdrop-filter:blur(2px)}
.modal{background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:7px 7px 0 var(--ink);max-width:680px;width:100%;padding:20px 22px;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.modal h2{margin-bottom:6px;font-size:26px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fab{position:fixed;right:20px;bottom:38px;z-index:30;width:68px;height:68px;border-radius:50%;font-size:30px;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);box-shadow:var(--sh);padding:0}
.fab:hover{background:#ffe066;transform:rotate(-8deg) scale(1.05)}
.bubble{position:fixed;right:22px;bottom:122px;z-index:31;width:min(470px,calc(100vw - 40px));max-height:74vh;background:#fff;border:3px solid var(--ink);border-radius:24px 24px 6px 24px;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;animation:pop .18s ease-out}
.bubble::after{content:"";position:absolute;right:16px;bottom:-20px;width:26px;height:20px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);clip-path:polygon(0 0,100% 0,100% 100%);transform:skewX(-20deg)}
.bubble .bh{padding:12px 14px;background:#e8f0ff;border-bottom:3px solid var(--ink);border-radius:21px 21px 0 0;font-family:var(--fh);font-size:18px}
.bubble .bh input{font-family:"Nunito",sans-serif;font-size:14px}
.bubble .bl{overflow:auto;padding:10px 12px;flex:1}
.bubble .cs{padding:8px 10px;border-radius:14px;border:2px solid var(--ink);margin-bottom:8px;font-size:14px;display:flex;gap:8px;align-items:flex-start;background:#fff;box-shadow:var(--shs)}
.bubble .cs span{flex:1}
.bubble .themes{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.bubble .themes button{min-height:28px;padding:1px 9px;font-size:12px;border-width:2px;box-shadow:none;font-family:"Nunito",sans-serif}
.bubble .themes button.on{background:var(--conseil);color:#fff}
.sign{position:fixed;right:12px;bottom:6px;z-index:29;font-size:12px;color:var(--mute);pointer-events:none;letter-spacing:.02em;background:rgba(255,246,229,.9);padding:1px 8px;border-radius:8px;border:1.5px solid rgba(31,37,68,.25)}
.sign b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;z-index:60;font-size:14px;font-weight:800;box-shadow:4px 4px 0 var(--yellow);animation:pop .18s ease-out}
.setgrid{display:grid;grid-template-columns:1fr;gap:18px}
.setgrid .card h3{font-size:20px;margin-bottom:4px}

/* ---------- Briques ---------- */
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;font-weight:700;margin:4px 0 8px 6px;align-items:center}
.legend i,.prev i{display:inline-block;width:18px;height:11px;border:1.5px solid var(--ink);border-radius:3px;vertical-align:middle;margin-right:5px}
.prev{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:3px;align-items:center;font-size:12px;color:var(--mute)}
.prev i{margin:0}
.prev span{margin-left:6px}
.brick{grid-column:1/-1;display:flex;gap:6px;align-items:center;background:var(--pc);border:2px solid var(--ink);border-radius:9px;padding:3px 4px;box-shadow:var(--shs)}
.brick .pal{min-height:30px;padding:0 8px;font-size:12.5px;border-width:2px;box-shadow:none;background:#fff;font-family:var(--fh)}
.brick .bt{flex:1;font-size:14px;line-height:1.35;min-height:1.3em}
.brick button.sm{min-height:28px}
.addb{grid-column:1/-1;display:flex;gap:5px;align-items:center}
.comp .addb input{flex:1;min-width:0;padding:6px 9px;font-size:14px}
.pb{min-height:36px;width:38px;padding:0;background:var(--pc);font-family:var(--fh);font-size:16px}
.ev{display:flex;flex-wrap:wrap}
.evb{min-height:0;padding:2px 8px;font-size:12px;border-width:1.5px;box-shadow:none;font-weight:600;white-space:normal;text-align:left;margin:2px 4px 0 0;background:#f6f7fb}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:30px 16px;align-items:end;margin-top:8px}
.wcol{display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.stack{display:flex;flex-direction:column-reverse;gap:3px}
.wb{width:calc(100% - 12px);text-align:left;white-space:normal;background:var(--pc);border:2px solid var(--ink);border-radius:7px;padding:4px 7px;min-height:0;font-size:12px;font-weight:700;line-height:1.25;box-shadow:2px 2px 0 var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wb.off{margin-left:12px}
.wb b{font-family:var(--fh)}
.wb.on{outline:3px solid var(--accent);outline-offset:2px}
.ground{border-top:6px solid var(--ink);margin-top:5px;padding-top:6px;text-align:center}
.ground .code{display:inline-block;font-family:var(--fh);font-weight:700;background:var(--yellow);border:2px solid var(--ink);border-radius:10px;padding:0 10px}
.ground small{font-size:11.5px;color:var(--mute);line-height:1.25;margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.flag{text-align:center;font-family:var(--fh);font-size:14px;margin-bottom:5px}
.wcol.vide .ground{opacity:.45}
.bsel{margin-bottom:20px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;background:var(--pc)}
.stat.p{background:var(--pc)}

/* ---------- Grille INSPE / sélecteur de brique ---------- */
.fabB{bottom:118px;background:#ff9f43}
.fabB:hover{background:#ffb26b}
.modal.bpm{max-width:1200px;width:96vw;padding:0;overflow:hidden}
.bp{display:grid;grid-template-columns:340px minmax(0,1fr);height:min(88vh,780px)}
.bpl{overflow:auto;border-right:3px solid var(--ink);background:var(--soft);padding:10px;border-radius:21px 0 0 21px}
.bpl .dom{font-family:var(--fh);font-weight:600;margin:10px 4px 4px;font-size:15px}
.bpl .gi{display:flex;width:100%;gap:8px;align-items:center;text-align:left;white-space:normal;margin-bottom:5px;padding:6px 8px;min-height:0;font-size:13px;line-height:1.25;box-shadow:none;border-width:2px}
.bpl .gi b{font-family:var(--fh);font-size:16px;min-width:20px}
.bpl .gi.on{background:var(--accent);color:#fff}
.bpl .gi .cnt{font-size:11px;background:#fff;color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:0 6px}
.bpr{overflow:auto;padding:16px 18px 0;display:flex;flex-direction:column;gap:6px}
.bpf{position:sticky;bottom:0;background:#fff;padding:10px 0 14px;border-top:2px dashed var(--soft);z-index:2}
.pv{display:inline-block;font-size:11.5px;font-weight:800;background:var(--pc);border:1.5px solid var(--ink);border-radius:999px;padding:0 7px;color:var(--ink);white-space:nowrap}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{border:2.5px solid var(--ink);border-radius:14px;background:var(--pc);padding:8px 10px;cursor:pointer;box-shadow:var(--shs);display:flex;flex-direction:column;gap:4px}
.pcard.on{outline:4px solid var(--accent);outline-offset:2px;transform:translate(-1px,-1px);box-shadow:var(--sh)}
.pcard.gone{opacity:.45;cursor:default}
.pcard .pd{font-size:13.5px;line-height:1.4;flex:1}
.passed{font-size:13px;background:#e8f8ef;border:2px dashed var(--ink);border-radius:10px;padding:4px 10px;margin-bottom:6px}
.crs{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0}
.crc{font-size:12px;background:#fff;border:1.5px solid var(--ink);border-radius:8px;padding:1px 7px;font-weight:700}
.crc button{min-height:0;padding:0 4px}
.bt:empty:before{content:attr(data-ph);color:var(--mute);font-style:italic;font-size:12.5px}
.domh{margin:24px 0 2px;font-size:19px}
.tabs button{font-size:13.5px;min-height:36px}
.bars{display:flex;gap:12px;align-items:flex-end;overflow:auto;padding:10px 4px 2px}
.bar{display:flex;flex-direction:column;align-items:center;min-width:54px;font-size:12px}
.stackbar{width:34px;display:flex;flex-direction:column;border:2px solid var(--ink);border-radius:8px 8px 3px 3px;overflow:hidden;min-height:4px;box-shadow:var(--shs)}
.bar b{font-family:var(--fh);font-size:17px;margin-top:4px}
.bar small{color:var(--mute);font-size:10.5px}
.axt.suivi td{padding:5px 6px}
.axt .domrow{font-family:var(--fh);font-weight:600;background:var(--soft);border-radius:8px}
.axt tr.faint td{opacity:.4}
.axt.grid td{vertical-align:top;font-size:13px;line-height:1.4;min-width:170px}
.axt.grid th{vertical-align:top;border-radius:8px}
@media (max-width:900px),(orientation:portrait){ .bp{grid-template-columns:1fr;height:auto;max-height:88vh;overflow:auto} .bpl{max-height:32vh;border-right:0;border-bottom:3px solid var(--ink);border-radius:21px 21px 0 0} .pcards{grid-template-columns:1fr} }

/* ---------- Chrono consignes / tâche ---------- */
.lapbar{margin:2px 0 0 8px}
.lapsp{background:#fff;border:2.5px solid var(--ink);border-radius:14px;box-shadow:var(--shs);padding:8px 10px;margin:6px 0 4px}
.lapr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:5px 6px 5px 10px;border-left:6px solid var(--lk);border-bottom:2px dashed var(--soft)}
.lapr .lk{font-weight:800;min-width:110px}
.lapr b.grow{font-family:var(--fh);font-size:17px}
.ct{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctb{min-height:50px;font-size:16px;padding:6px 14px;background:#fff}
.ctb b{font-family:var(--fh);font-variant-numeric:tabular-nums;font-size:20px;margin-left:6px}
.ctb.c.on{background:#2f6df0;color:#fff;animation:pulseC 1.6s infinite}
.ctb.t.on{background:#1fc28b;color:var(--ink);animation:pulseT 1.6s infinite}
@keyframes pulseC{50%{box-shadow:2px 2px 0 var(--ink),0 0 0 6px rgba(47,109,240,.3)}}
@keyframes pulseT{50%{box-shadow:2px 2px 0 var(--ink),0 0 0 6px rgba(31,194,139,.35)}}
.ctbar{display:flex;height:10px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin-top:5px;max-width:520px}
.ctbar i{display:block;height:100%}
.nav .it.running{box-shadow:var(--shs),0 0 0 3px rgba(31,194,139,.45)}
.runk{color:var(--rk);font-weight:900}
.nav .it.on .runk{color:var(--ink)}

/* ---------- Jauge & critères rapprochés ---------- */
.gauge{position:relative;flex:1;max-width:190px;height:24px;background:#fff;border:2px solid var(--ink);border-radius:999px;overflow:hidden;margin-right:auto}
.gauge div{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(45deg,#1fc28b 0 8px,#3fd7a3 8px 16px)}
.gauge span{position:relative;display:block;text-align:center;font-size:12px;font-weight:800;line-height:20px}
.crrel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.crg{border:2px solid var(--ink);border-radius:12px;padding:6px 8px;background:#fafbff}
.crf{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em;font-weight:800}
.tc{min-height:0;padding:3px 9px;font-size:12.5px;border-width:1.5px;box-shadow:none;white-space:normal;text-align:left;font-weight:700;background:#fff}
.tc.main{font-size:13px;width:100%;margin:3px 0 4px;border-width:2px}
.tc.on{background:var(--accent);color:#fff}
.crall summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--mute);margin:6px 0}
@media (max-width:900px),(orientation:portrait){ .crrel{grid-template-columns:1fr} }

/* ---------- Chemin & pistes ---------- */
.tracks{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px 18px}
.trk{display:grid;grid-template-columns:1fr;gap:3px}
.trl{font-size:13px;line-height:1.25}
.trl b{font-family:var(--fh);font-size:15px;margin-right:4px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.stp{position:relative;height:26px;border:2px solid #1f2544;border-radius:6px;background:#fff;overflow:hidden}
.stp:nth-child(1){margin-top:9px}.stp:nth-child(2){margin-top:6px}.stp:nth-child(3){margin-top:3px}
.stp.done{background:var(--pc)}
.stp i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(45deg,var(--pc) 0 6px,#fff8 6px 9px);border-right:2px dashed #1f2544}
.stp span{position:relative;display:block;text-align:center;font-size:11.5px;font-weight:800;line-height:22px}
.trn{font-size:11.5px;color:var(--mute);text-align:right}
.p-prog{break-before:page;page-break-before:always}
.p-cheer{border:2px solid #1f2544;border-radius:10px;background:#fff8d6;padding:8px 12px;font-size:11pt;margin:6px 0 4px}
@media print{ .tracks{grid-template-columns:1fr 1fr;gap:6px 14px} .trl{font-size:8.5pt} .trn{font-size:8pt} .stp{height:18px} .stp span{font-size:8pt;line-height:14px} svg{break-inside:avoid} }

/* ---------- Pas de progression sur les axes ---------- */
.axq{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:96px}
.axb{display:flex;flex-wrap:wrap;gap:2px;justify-content:flex-end;max-width:170px}
.axb i{width:14px;height:9px;border:1.5px solid var(--ink);border-radius:2px;display:inline-block}
.axn{font-size:12px;color:var(--mute);white-space:nowrap}
.axn b{font-family:var(--fh);font-size:18px;color:var(--ink)}
.banner .ax .step{min-height:38px;padding:3px 10px;font-size:14px;background:var(--yellow)}
.axmini{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center}
.axmini .chip{font-size:13px}
.axt{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;margin-top:6px}
.axt th,.axt td{border-bottom:2px dashed var(--soft);padding:6px 8px;text-align:left;vertical-align:middle}
.axt th{font-family:var(--fh);font-weight:600}
.axt th small{display:block;font-family:"Nunito",sans-serif;font-size:11px;color:var(--mute)}
.axt .c,.p-axt .c{text-align:center}
.axt .c .axb{justify-content:center;margin:2px auto 0}
.axt .c b{font-family:var(--fh);font-size:18px}
.steplist{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.steplist .brick{grid-column:auto}

/* ---------- Transfert QR ---------- */
.modal.wide{max-width:980px}
.sendgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:start}
.sendgrid .qr-box img{width:min(400px,56vh,80vw)}
@media (max-width:820px),(orientation:portrait){ .sendgrid{grid-template-columns:1fr} }
.qr-box{display:flex;flex-direction:column;align-items:center;gap:8px}
.qr-box img{width:min(440px,58vh,84vw);height:auto;image-rendering:pixelated;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:var(--sh)}
.qr-part{font-family:var(--fh);font-weight:700;font-size:20px}
.qr-nums{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.qr-nums button{min-width:40px;min-height:34px;padding:2px 8px;font-size:13px}
.qr-nums button.on{background:var(--accent);color:#fff}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
label.btn{display:inline-flex;align-items:center;cursor:pointer;border:var(--bw) solid var(--ink);background:#fff;border-radius:14px;padding:7px 14px;min-height:42px;font-weight:800;box-shadow:var(--shs);text-transform:none;font-family:"Nunito",sans-serif;font-size:15px;color:var(--ink);letter-spacing:0;margin:0}
.btn.orange{background:var(--yellow)}
.center{text-align:center}
.scan-wrap{position:relative;max-width:560px;margin:0 auto;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:4/3;border:3px solid var(--ink);box-shadow:var(--sh)}
.scan-wrap video{width:100%;height:100%;object-fit:cover;display:block}
.scan-frame{position:absolute;inset:8%;border:5px solid var(--yellow);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.scan-prog{position:relative;height:30px;background:var(--soft);border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.scan-bar{position:absolute;left:0;top:0;bottom:0;background:var(--sit)}
.scan-prog span{position:relative;display:block;text-align:center;font-weight:900;line-height:26px}

/* ---------- Paysage / grand écran : on exploite la largeur ---------- */
@media (min-width:1000px){
  .fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:18px;align-items:start}
  .fgrid.solo{grid-template-columns:1fr}
  .fgrid.solo>.col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 18px;align-items:start}
  .fgrid>.col{min-width:0}
  .compgrid{grid-template-columns:1fr 1fr}
  .sgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
  .setgrid{grid-template-columns:1fr 1fr}
  .setgrid .full{grid-column:1/-1}
  .fgrid textarea[data-k="f.text"]{min-height:150px}
}
@media (min-width:900px) and (orientation:landscape){
  .obsapp{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  .obsapp .top{position:relative}
  .obsapp .layout{flex:1;min-height:0;padding-bottom:0}
  .obsapp .nav,.obsapp .main{overflow:auto;min-height:0;overscroll-behavior:contain}
  .obsapp .main{padding-top:14px}
  .obsapp .nav{padding-top:6px;padding-bottom:40px}
}
@media (min-width:1400px){
  .layout{grid-template-columns:260px minmax(0,1fr)}
  .compgrid{grid-template-columns:1fr 1fr 1fr}
}
@media (max-width:1180px){ .top .lbl{display:none} .brand small{display:none} }
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:8px}
  .nav .it{min-width:160px}
  .nav .it.on{transform:translateY(-2px)}
  .nav hr{display:none}
  .nav>.row{min-width:220px}
  .banner .ax{grid-template-columns:1fr auto;grid-template-areas:"txt txt" "q btn" "seg seg"}
  .banner .ax .seg{justify-self:start}
  .two{grid-template-columns:1fr}
  .chrono .t{font-size:22px;min-width:76px}
  .axgrid{grid-template-columns:1fr}
  .hero svg{display:none}
  .wrap{padding:16px}
}

/* ---------- PRINT ---------- */
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;background-image:none;font-size:10.5pt;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:400}
  #app,.fab,.bubble,.sign,.drawer,.modalbg,.toast{display:none!important}
  #print{display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.p-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #0f172a;padding-bottom:6px;margin-bottom:10px}
.p-head h1{font-size:18pt}
.p-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 14px;font-size:10pt;margin-bottom:10px}
.p-meta b{color:#475569;font-weight:600}
.p-box{border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;margin:8px 0;break-inside:avoid}
.p-h2{font-size:12pt;font-weight:800;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.03em}
.p-frame{border-left:5px solid var(--c);padding:4px 0 4px 10px;margin:10px 0;break-inside:avoid-page}
.p-frame h3{font-size:12pt;display:flex;justify-content:space-between}
.p-frame h3 small{font-weight:400;color:#64748b;font-size:9.5pt}
.p-txt{white-space:pre-wrap;margin:4px 0}
.p-it{margin:3px 0;padding:3px 8px;border-left:3px solid var(--k);background:#f8fafc;break-inside:avoid}
.p-it.conseil{background:#eff6ff;border:1px solid #bfdbfe;border-left:3px solid #2563eb;border-radius:10px 10px 10px 2px}
.p-img{max-width:100%;max-height:85mm;border:1px solid #e2e8f0;border-radius:6px;margin-top:4px}
.p-tl .cons{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 3px,transparent 3px 7px)!important}
.p-leg i.cons{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 2px,transparent 2px 4px)}
.p-tl .fs{border-left:2.5px solid #fff}
.p-kpi{display:flex;gap:16px;flex-wrap:wrap;font-size:10pt;margin:2px 0 4px}
.p-time td,.p-time th{font-size:9pt;padding:2px 6px}
.p-tl{display:flex;height:16px;border-radius:4px;overflow:hidden;margin:4px 0 2px}
.p-tl div{color:#fff;font-size:7.5pt;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
.p-table{width:100%;border-collapse:collapse;font-size:9.5pt}
.p-table td,.p-table th{border:1px solid #cbd5e1;padding:4px 6px;text-align:left;vertical-align:top}
.p-lv{font-weight:700;white-space:nowrap}
.p-axe{border:2px solid #e11d48;border-radius:8px;padding:6px 10px;margin:6px 0;break-inside:avoid}
.p-b{display:inline-block;background:var(--pc);border:1px solid #333;border-radius:4px;padding:1px 6px;margin:2px 3px 2px 0;font-size:9pt;break-inside:avoid}
.p-table .p-b{display:block}
.p-mini div{margin:2px 0;font-size:9pt;break-inside:avoid}
.p-mini i,.p-leg i{display:inline-block;width:13px;height:8px;border:1px solid #333;border-radius:2px;margin-right:2px;vertical-align:middle}
.p-leg{font-size:8.5pt;color:#475569;margin:2px 0 6px}
.p-axt .axb{display:block}
.p-axt .axb i{display:inline-block;width:11px;height:7px;border:1px solid #333;border-radius:2px;margin:0 1px}
.p-step{font-size:9pt;margin:1px 0 1px 14px;color:#334155}
.p-axt td,.p-axt th{text-align:center}
.p-axt td:first-child{text-align:left}
.p-wcol{break-inside:avoid;margin:8px 0;border-left:4px solid #1f2544;padding-left:8px}
.p-foot{margin-top:18px;display:flex;justify-content:space-between;font-size:9pt;color:#64748b;border-top:1px solid #cbd5e1;padding-top:6px}
</style>
</head>
<body>
<script src="lib/qrcode.js"></script>
<script src="lib/jsQR.js"></script>
<script src="lib/zxing-reader.js"></script>
<script src="lib/neps-qr.js"></script>
<div id="app"></div>
<div id="print"></div>
<div class="sign">N'EPS · by <b>Quentin Delisle</b></div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden">
<input type="file" id="pktFile" accept=".json,.neps,application/json" class="hidden">

<script>
/* =========================================================
   N'EPS · Visites stagiaires — by Quentin Delisle
   Données stockées localement (localStorage) — export JSON possible
   ========================================================= */
const LS = 'neps-stagiaires-v1';

const TYPES = {
  pem:    {l:'Prise en main',        c:'var(--pem)',    hex:'#7c6cf2', r:0},
  echauf: {l:'Échauffement',         c:'var(--echauf)', hex:'#ffb020', r:1},
  be:     {l:'Bilan de fin d’échauffement', c:'var(--be)', hex:'#ff8a3d', r:1.5},
  sit:    {l:'Situation de travail', c:'var(--sit)',    hex:'#1fc28b', r:2},
  bi:     {l:'Bilan intermédiaire',  c:'var(--bi)',     hex:'#2fb5f0', r:3},
  bf:     {l:'Bilan final',          c:'var(--bf)',     hex:'#ff4f7b', r:4},
};
const KINDS = {
  obs:     {l:'Observation', ic:'📝', c:'#64748b'},
  fort:    {l:'Point fort',  ic:'✅', c:'#16a34a'},
  vig:     {l:'Vigilance',   ic:'⚠️', c:'#ea580c'},
  secu:    {l:'Sécurité',    ic:'🛑', c:'#dc2626'},
  conseil: {l:'Conseil',     ic:'💡', c:'#2563eb'},
};
const LEVELS = ['Non observé','À construire','En cours','Acquis'];
const LV_COL = ['#64748b','#dc2626','#ea580c','#16a34a'];
const AX_STATUS = ['À observer','Non travaillé','En progrès','Atteint'];
const PAL = [{l:'Palier non précisé',c:'#e3e5ee'},{l:'Palier 1',c:'#ffb3a7'},{l:'Palier 2',c:'#ffd43b'},{l:'Palier 3',c:'#7cd4f5'},{l:'Palier 4',c:'#5fd39a'}];

/* Référentiels intégrés : Paliers de professionnalisation INSPE (Master MEEF EPS 2024-2025) et Critères (synthèse pour le professeur stagiaire) */

ectifs, critères de réalisation et de réussite des situations convergent vers « ce qu’il y a à apprendre ». La leçon s’inscrit dans le projet de séquence.", "La préparation de leçon est formulée en « langage élève » favorise son appropriation par les élèves. Les différentes situations répondent à une « logique » de leçon."]}, {"n": 3, "l": "Outiller les élèves pour qu’ils apprennent et se régulent", "d": ["Les critères de réussite sont absents de la préparation de leçon ou non fonctionnels.", "La majorité des élèves progresse. Les critères de réussite prévus ne sont pas ou peu mobilisés par les élèves en situation. Les variables didactiques sont peu opérationnelles et/ou rarement utilisées durant la leçon.", "Des critères de réussite fonctionnels sont mobilisés par les élèves pour s’auto-co-évaluer. Des variables ou ateliers différenciés permettent à l’enseignant·e d'orienter les élèves entre les situations.", "Les outils et rôles sociaux du dispositif permettent l’auto-co-régulation des élèves en situation, grâce à l’articulation de critères de réalisation, d’observables et de régulations. Les outils numériques y contribuent le cas échéant."]}, {"n": 4, "l": "Transmettre des compétences motrices, méthodologiques et sociales", "d": ["Les situations envisagées ne répondent pas directement aux objectifs visés.", "Les situations visent des objectifs, souvent nombreux et/ou exclusivement moteurs. Les solutions sont le plus souvent données aux élèves, ne laissant que peu de place à leur réflexion.", "Les situations et les rôles sociaux permettent aux élèves de faire des choix (seuls et/ou en collectif) et de développer des savoirs, savoir-faire et savoir-être ciblés. Le « pourquoi » du travail est expliqué pour impliquer les élèves.", "Les situations mettent explicitement au travail des savoir-faire et savoir-être (tels que l’autonomie, les méthodes, le travail de groupe, ou l’entraide) et sont adaptés à la diversité des élèves. Une situation problème ou question inductive contribue à mobiliser un grand nombre d’élèves."]}, {"n": 5, "l": "Faire partager des valeurs au sein du groupe classe", "d": ["Le projet de classe est absent ou limité à des constats et objectifs.", "Le projet de classe oriente les séquences vers les objectifs éducatifs ciblés, mais leur concrétisation est approximative ou difficile.", "Le projet de classe prend en compte les spécificités de certain·e·s élèves ou groupes d’élèves et son opérationnalisation au sein des séquences est anticipée. Il s’inscrit dans le projet d’établissement.", "Le projet de classe s’ouvre à des enjeux interdisciplinaires. L’hétérogénéité des élèves y est pensée pour développer la fraternité et viser la réussite de tous·tes."]}]}, {"t": "Pendant la leçon", "s": "D’une logique d’organisation centrée l’activité de l’enseignant·e et les APSAD… (Faire faire) … vers une logique d’apprentissage centrée sur l’activité des élèves, voire de chaque élève. (Faire apprendre)", "p": ["Gère l’organisation", "Transmet des savoirs simples", "Permet aux élèves de développer leurs compétences", "Implique chaque élève dans un parcours d’apprentissage"], "items": [{"n": 6, "l": "Assurer la sécurité des élèves", "d": ["La sécurité physique des élèves n’est pas toujours effective.", "Fait respecter des règles de sécurité physique, passives et actives. Maîtrise le protocole de l’établissement en cas d’accident.", "Explicite et justifie auprès des élèves les règles et fonctionnements liés à la sécurité. Repère et réagit aux éventuels signes de mal-être d’élèves.", "Met en œuvre une éducation active à la sécurité. Anticipe et suit de manière différenciée d’éventuelles situations de mal-être d’élèves."]}, {"n": 7, "l": "Instaure un cadre propice au travail", "d": ["Gère globalement l’espace et le temps en cohérence avec sa préparation de leçon, pour mettre les élèves en activité.", "Explicite et met en œuvre des règles et routines de fonctionnement visant à maximiser le temps d’apprentissage des élèves.", "Se positionne lorsque nécessaire de manière juste et équitable pour faire respecter le cadre et impliquer les élèves dans le travail. Adapte si besoin sa préparation de leçon pour répondre au rythme réel d’apprentissage des élèves.", "Implique les élèves dans la construction du cadre de travail, et les responsabilise dans son application. Favorise par sa posture et ses choix didactique les interactions et coopérations entre élèves, ainsi que l’entraide et l’empathie."]}, {"n": 8, "l": "Délivrer des consignes efficaces", "d": ["Délivre des consignes longues, pas toujours entendues et/ou comprises par les élèves.", "Délivre des consignes courtes sur « ce qu’il y a à faire » et permet ainsi la mise en activité rapide des élèves.", "Diversifie les supports ou modalités de consignes et questionne les élèves pour s’assurer de leur compréhension. Met en avant quelques éléments clés de la situation et permettant la mise au travail des élèves autour de « ce qu’il y a à apprendre ».", "Les consignes attisent le désir d’apprendre des élèves, en co-construisant avec eux le sens du travail (réponse au problème, cohérence année/séquence/leçon/situation) et/ou par une théâtralisant du propos."]}, {"n": 9, "l": "Observer et réguler", "d": ["Ne prend pas ou peu de recul pour observer les élèves durant la leçon, ou n’intervient pas ou peu auprès des élèves.", "Observe régulièrement l’organisation de la leçon et intervient auprès des élèves pour les (ré)impliquer dans le travail demandé.", "Observe l’activité d’apprentissage (motrice, méthodologique et sociale) des élèves en lien avec les critères de réussite et de réalisation afin d’adapter si besoin le dispositif (à l’aide de variables) et /ou de les guider par ses interventions.", "Observe de manière différenciées les élèves ou groupes d’élèves pour les soutenir émotionnellement et/ou les guider dans l’auto-co-régulation de leur travail. Adapte ses interventions au degré d’autonomie des élèves."]}, {"n": 10, "l": "Entretenir une relation pédagogique positive", "d": ["Les échanges avec les élèves sont rares, descendants et/ou négatifs. La relation pédagogique n’est pas toujours sereine.", "Installe une relation respectueuse grâce à des échanges réguliers et réciproques avec les élèves. Est attentif aux sollicitations des élèves et y répond.", "Installe une relation positive en conseillant, encourageant ou valorisant les élèves. Parviens à résoudre d’éventuelles situations de domination, stigmatisation, discrimination ou dévalorisation entre élèves.", "Installe une relation de confiance avec les élèves, en prenant en compte de manière différenciée leurs vécus affectifs. Contribue à la confiance et au bien-être des élèves les plus en besoin par une posture bienveillante."]}]}, {"t": "Au-delà de la leçon", "s": "D’une logique passive de mise en œuvre individuelle… (Faire) … vers une logique active de développement professionnel au sein d’un collectif. (Se former)", "p": ["Est spectateur de sa pratique", "Analyse partiellement sa pratique", "Se met en projet et évolue en lien avec ses tuteur·ice·s", "Est acteur de sa formation et du collectif"], "items": [{"n": 11, "l": "Donner à voir son activité", "d": ["Le dossier de stage est incomplet ou non structuré.", "Complète son dossier de stage irrégulièrement ou en fin d’année. Ne respecte pas le droit d’auteur, le droit à l’image ou la taille maximale du dossier de 150Mo.", "Donne à voir (dans les temps) ses préparations à ses tuteur·ice·s dans son dossier de stage. Consigne chaque semaine ses tentatives dans son projet de développement professionnel.", "Communique ses préparations de manière anticipée pour permettre la régulation de ses tuteur·ice·s. Rend compte de ses réflexions dans son projet de développement professionnel."]}, {"n": 12, "l": "Analyser son activité professionnelle", "d": ["Décrit son activité professionnelle sans prise de recul.", "Analyse son activité au filtre d’éléments anecdotiques de la leçon. Envisage des pistes simples d’amélioration, sans les hiérarchiser.", "Extrait de l’analyse de son activité des axes de développement professionnel prioritaires ; les explicite, les évalue et les actualise dans son projet de développement professionnel.", "Analyse son action d’enseignant·e au regard de l’apprentissage des élèves, de manière continue et à l’échelle de la leçon comme du projet de développement professionnel."]}, {"n": 13, "l": "Faire évoluer sa pratique", "d": ["Ne concrétise pas toujours en actes les mises en œuvre envisagées.", "Fait évoluer certains aspects de son activité, avec des effets limités sur l’apprentissage des élèves.", "Favorise l’apprentissage des élèves grâce à de nouvelles tentatives hebdomadaires ciblées.", "Par des tentatives cohérentes, fait évoluer son enseignement de manière significative sur ses axes de développement prioritaires. Expérimente des démarches innovantes."]}, {"n": 14, "l": "S’impliquer dans le collectif de stage", "d": ["Ne perçoit ou n’accepte que rarement les remarques de ses tuteur·ice·s.", "S’appuie sur la responsabilité, les observations et les conseils de ses tuteur·ice·s (et binôme de stage le cas échéant)", "Sollicite de lui-même ses tuteur·ice·s pour étayer ses choix. Assiste à des réunions ou actions de l’équipe EPS, d’AS ou de son établissement.", "Se tourne vers les personnes ressources de l’établissement pour résoudre des situations éducatives. Contribue aux réflexions et/ou projets de l’établissement en s’impliquant au sein de l’équipe éducative."]}, {"n": 15, "l": "Adopter une posture professionnelle responsable", "d": ["Est parfois en retard ou absent en stage, sans prévenir et/ou sans justification recevable.", "Assume ses obligations règlementaires d’assiduité et de ponctualité. Respecte et fait respecter le règlement intérieur de son établissement (suivi d’assiduité, …). Ne réponds pas toujours aux exigences de formation lié au suivi de stage.", "Est « présent·e » pour ses élèves : impliqué·e, disponible et accompagnant·e. Parvient à résoudre d’éventuels dilemmes éthiques avec l’aide de ses tuteur·ice·s ou de l’équipe éducative. Respecte les délais et fonctionnements du suivi de stage.", "En stage comme en formation, agit avec justice, bienveillance et tact pour faire partager les valeurs et principes de l’École. Prévient et résout de manière éducative les dilemmes éthiques rencontrés avec les élèves."]}]}];

/* ---------- Chrono ---------- */
function elapsed(o){ o=o||O(); if(!o) return 0; const c=o.chrono; return c.acc + (c.startedAt? Date.now()-c.startedAt : 0); }
/* ---------- Chrono des phases : séquences « consignes » / « tâche » ----------
   f.laps = [{k:'c'|'t'|'n', s, e}] en ms de chrono ; f.start / f.end sont déduits (compatibilité). */
const CT_TYPES = ['sit','echauf'];
const hasCT = f => CT_TYPES.includes(f.type);
const defaultKind = f => hasCT(f) ? 'c' : 'n';
const LAPK = {c:{l:'Consignes',ic:'🗣️',col:'#2f6df0'}, t:{l:'Tâche',ic:'🏃',col:'#1fc28b'}, n:{l:'Phase',ic:'⏱',col:'#62668a'}};
function lapsOf(f){ if(!f.laps) f.laps = f.start!=null ? [{k:'n',s:f.start,e:f.end??null}] : []; return f.laps; }
function openLapOf(f){ return lapsOf(f).find(l=>l.e==null); }
function syncFrame(f){ const L=lapsOf(f); if(!L.length){ f.start=null; f.end=null; return; } L.sort((a,b)=>a.s-b.s); f.start=L[0].s; f.end=L.some(l=>l.e==null)?null:Math.max(...L.map(l=>l.e)); }
const hasTime = f => !!(f.man || lapsOf(f).length);
function frameTotals(f,o){ if(f.man){ const m=f.man, r={c:m.c||0,t:m.t||0,n:m.n||0,man:true}; r.all=r.c+r.t+r.n; return r; } const r={c:0,t:0,n:0}; lapsOf(f).forEach(l=>{ r[l.k]=(r[l.k]||0)+Math.max(0,(l.e??elapsed(o))-l.s); }); r.all=r.c+r.t+r.n; return r; }
/* arrête la phase à l'instant « at » (supprime ce qui commencerait après) */
function closeFrame(f,at){ f.laps=lapsOf(f).filter(l=>l.s<at).map(l=>({...l,e:l.e==null||l.e>at?at:l.e})); syncFrame(f); }
const clockNow = () => new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
/* ouvre une séquence (consignes / tâche) sur une phase : les autres phases s'arrêtent */
function openLap(o,f,k){
  if(!o.chrono.startedAt) o.chrono.startedAt=Date.now();
  const now=elapsed(o); delete f.man;
  o.frames.forEach(x=>{ if(x!==f && openLapOf(x)) closeFrame(x,now); });
  const L=lapsOf(f), op=openLapOf(f);
  if(op){ if(op.k===k) return false; op.e=now; if(op.e-op.s<1500) L.splice(L.indexOf(op),1); }
  if(!L.length) f.clock=clockNow();
  L.push({k,s:now}); syncFrame(f); return true;
}
let lapsOpen=false;
function lapsPanelHTML(f){
  const o=O(), now=elapsed(o), L=lapsOf(f);
  return `<div class="lapsp">${L.map((l,i)=>{ const d=Math.max(0,(l.e??now)-l.s);
    return `<div class="lapr" style="--lk:${LAPK[l.k].col}"><b>${i+1}</b><span class="lk">${LAPK[l.k].ic} ${LAPK[l.k].l}</span>
      <span class="muted">${clockAt(now-l.s)} → ${l.e==null?'<b style="color:#1fa463">en cours</b>':clockAt(now-l.e)}</span><b class="grow">${fmtShort(d)}</b>
      ${hasCT(f)?`<button class="sm" data-act="lapSwap" data-i="${i}" title="C'était l'autre type (consignes ⇄ tâche)">⇄ ${l.k==='c'?'Tâche':'Consignes'}</button>`:''}
      <button class="sm danger" data-act="lapDel" data-i="${i}" title="Supprimer ce temps mal pris">✕ Supprimer</button></div>`; }).join('')}
    <div class="row" style="justify-content:flex-end;margin-top:6px"><span class="muted grow" style="font-size:12.5px">Supprimer un temps retire sa durée du total (le chrono général ne bouge pas).</span><button class="sm danger" data-act="lapsClear">🗑 Effacer tous les temps de « ${esc(f.title)} »</button></div></div>`;
}
function afterLapEdit(o,f){ syncFrame(f); const L=lapsOf(f); f.clock = L.length ? clockAt(elapsed(o)-L[0].s) : ''; save(true); keepScroll(refreshMain); refreshNav(); }
function stopFrame(o,f){ const op=openLapOf(f); if(op){ op.e=elapsed(o); syncFrame(f); } }
const autoPhase = () => S.settings.autoPhase!==false;
/* ouvrir une phase jamais chronométrée pendant que le chrono tourne : elle démarre, la précédente s'arrête */
function autoStart(){ const o=O(), f=F(); if(!o||!f||!autoPhase()||!o.chrono.startedAt||hasTime(f)) return;
  const prev=o.frames.find(x=>openLapOf(x)); openLap(o,f,defaultKind(f)); save(true);
  toast(`${LAPK[defaultKind(f)].ic} ${f.title} démarre${prev?` · ${prev.title} arrêtée (${fmtShort(frameTotals(prev,o).all)})`:''}`); }

setInterval(()=>{
  const o=O(); if(!o||view!=='obs') return;
  const f_=F(); if(f_&&f_.laps){ const tt=frameTotals(f_,o); document.querySelectorAll('.lapv').forEach(e=>e.textContent=fmtShort(tt[e.dataset.lk]||0)); }
  o.frames.forEach(x=>{ if(openLapOf(x)){ const e=document.querySelector(`.dur[data-fid="${x.id}"]`); if(e) e.textContent=fmtShort(frameTotals(x,o).all); } });
  const t=$('#chronoT'); if(t) t.textContent=fmt(elapsed(o));
  const m=$('#measureBtn'); if(m&&measureStart!==null) m.textContent='⏹ '+fmtShort(elapsed(o)-measureStart);
  const tm=$('#timing'); if(tm) tm.innerHTML=timingHTML(F());
},500);

    const chip=(id,txt,main)=>`<button class="tc ${main?'main':''} ${st.cr.includes(id)?'on':''}" data-tc="${id}">${esc(txt)}</button>`;

        return `<div class="crg"><span class="crf">${esc(CRIT[f].t)}</span>${chip(id,C_[0],true)}<div class="crs">${C_[1].map((x,i)=>chip(id+'.'+i,x,false)).join('')}</div></div>`; }).join('')}</div>`

    if(b.dataset.val){ const p=+b.dataset.val; t.pal=t.pal||{}; t.pal[st.gi]={p,d:o.date||today(),o:o.id}; t.u=Date.now(); if(st.p&&st.p<p) st.p=null; save(true,true); drawL(); drawD(); toast(`✓ Item ${st.gi} : palier ${p} validé`); return; }
    if(b.dataset.unval){ const p=+b.dataset.unval; t.pal=t.pal||{}; if(p>2) t.pal[st.gi]={p:p-1,d:o.date||today(),o:o.id}; else delete t.pal[st.gi]; t.u=Date.now(); save(true,true); drawL(); drawD(); return; }
    if(b.dataset.rmc){ st.cr=st.cr.filter(c=>c!==b.dataset.rmc); drawC(); return; }
    if(b.dataset.tc){ const id=b.dataset.tc; st.cr=st.cr.includes(id)?st.cr.filter(c=>c!==id):[...st.cr,id]; drawC(); return; }
    if(b.dataset.p){ st.p=+b.dataset.p; drawD(); return; }
    if(b.id==='bpOK'){

      if(!st.p){ bg.querySelector('#bpMsg').textContent='Touche le palier observé.'; return; }
      const text=bg.querySelector('#bpT').value.trim();

      else { const run=o.frames.find(f=>f.start!=null&&f.end==null), ph=run||(F()&&!String(curFrame).startsWith('__')?F():null);
        o.bricks.push({id:uid(),gi:st.gi,p:st.p,text,cr:st.cr,...(opts.ax?{ax:opts.ax.k,axT:opts.ax.t}:{}),ph:ph?ph.title:'',tm:elapsed(o)}); }
      save(); bg.remove(); render(); toast(edit?'Brique modifiée':`🧱 Brique posée · item ${st.gi} · palier ${st.p}`);
    }
  });
  if(!edit) setTimeout(()=>bg.querySelector('#bpT').focus(),50);
  const sel=bg.querySelector('.gi.on'); sel&&sel.scrollIntoView({block:'center'});
}

/* Suivi dans le temps : une colonne par leçon */
function suiviData(t){

  return {visits,valAt};
}

  const ax=axisTableHTML(t.id);

/* ---------- Progression visible par le stagiaire : chemin, mur, pistes ---------- */
function progData(t, upto){
  const visits=obsOf(t.id).slice().reverse().filter(v=>!upto||visitKey(v)<=visitKey(upto));
  const {valAt}=suiviData(t); const vals={}; // validations par visite (index dans la liste complète → id)
  const full=obsOf(t.id).slice().reverse();
  Object.entries(valAt).forEach(([n,r])=>{ const v=full[r.vi]; if(v) (vals[v.id]=vals[v.id]||[]).push({n:+n,p:r.p}); });
  return {visits,vals};
}
/* Le chemin : une étape par leçon, les briques gagnées au-dessus, les paliers validés en drapeau */
function pathSVG(t, upto, hi, opts={}){
  const {visits,vals}=progData(t,upto); if(!visits.length) return '';
  const N=opts.perRow||5, W=1000, SX=160, X0=170, RH=210, TOP=120;
  const pts=visits.map((v,i)=>{ const r=Math.floor(i/N), k=i%N, x=r%2? X0+(N-1-k)*SX : X0+k*SX; return {x, y:TOP+r*RH, v}; });
  const last=pts[pts.length-1], li=pts.length, lr=Math.floor(li/N), lk=li%N;
  const next={x: lr%2? X0+(N-1-lk)*SX : X0+lk*SX, y:TOP+lr*RH};
  const seg=(a,b)=> a.y===b.y ? ` L${b.x},${b.y}` : (()=>{ const dx=a.x>W/2?120:-120; return ` C${a.x+dx},${a.y} ${b.x+dx},${b.y} ${b.x},${b.y}`; })();
  let d=`M${pts[0].x-130},${pts[0].y} L${pts[0].x},${pts[0].y}`; for(let i=1;i<pts.length;i++) d+=seg(pts[i-1],pts[i]);
  const dn=`M${last.x},${last.y}`+seg(last,next);
  const H=next.y+110;
  const brickRow=(bs,x,y)=>{ const show=bs.slice(0,12), w=20,h=11, per=6; return show.map((b,k)=>{ const r=Math.floor(k/per), c=k%per, rowN=Math.min(per,show.length-r*per);
      const bx=x-rowN*w/2+c*w+(r%2?w/4:0), by=y-r*(h+1); return `<rect x="${bx}" y="${by}" width="${w-2}" height="${h}" rx="2" fill="${PAL[b.p||0].c}" stroke="#1f2544" stroke-width="1.5"/>`; }).join('')
      +(bs.length>12?`<text x="${x+68}" y="${y+9}" font-size="13" font-weight="800" fill="#1f2544">+${bs.length-12}</text>`:''); };
  const st=pts.map(({x,y,v})=>{ const bs=v.bricks||[], cur=hi&&v.id===hi.id, vv=vals[v.id]||[];
    return `<g>${brickRow(bs,x,y-48)}

/* Le mur : toutes les briques en appareillage décalé, celles de la leçon mises en avant */
function wallSVG(t, upto, hi){

  const K=12, w=80, h=32, W=K*w+w/2+20, rows=Math.ceil(bs.length/K), H=rows*h+40;
  const r=bs.map((b,i)=>{ const row=Math.floor(i/K), c=i%K, x=10+c*w+(row%2?w/2:0), y=H-30-(row+1)*h; const isNew=hi&&b.o.id===hi.id;
    return `<g><rect x="${x}" y="${y}" width="${w-3}" height="${h-3}" rx="4" fill="${PAL[b.p||0].c}" stroke="${isNew?'#5b4bdb':'#1f2544'}" stroke-width="${isNew?4:2}"/>
      <text x="${x+(w-3)/2}" y="${y+19}" text-anchor="middle" font-size="12" font-weight="800" fill="#1f2544">${b.gi?'item '+b.gi:esc(b.comp||'')}${isNew?' ★':''}</text></g>`; }).join('');

const FIELDS=[['blank','Fond vierge'],['grid','Quadrillage'],['gymR','Gymnase rectangulaire'],['gymC','Gymnase carré'],

  ['bad','Badminton'],['tt','Tennis de table'],['athle','Piste d’athlétisme'],['sprint','Couloirs 100 m'],['pool','Piscine 25 m']];
const BG_ALIAS={gym:'gymR'};
function fitM(wm,hm,mg=26){ const W=1000,H=560, s=Math.min((W-2*mg)/wm,(H-2*mg)/hm), x0=(W-wm*s)/2, y0=(H-hm*s)/2; return {s,x0,y0,X:m=>x0+m*s,Y:m=>y0+m*s}; }
function ln(c,x1,y1,x2,y2){ c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); }
function rc(c,x,y,w,h,fill){ if(fill){ c.fillStyle=fill; c.fillRect(x,y,w,h); } c.strokeRect(x,y,w,h); }
function planks(c,x,y,w,h,base,line){ c.fillStyle=base; c.fillRect(x,y,w,h); c.strokeStyle=line; c.lineWidth=1; for(let yy=y+14;yy<y+h;yy+=14) ln(c,x,yy,x+w,yy); for(let yy=y,k=0;yy<y+h;yy+=14,k++) for(let xx=x+(k%3)*60;xx<x+w;xx+=180) ln(c,xx,yy,xx,Math.min(yy+14,y+h)); }
function grass(c,g,wm,hm,bands=12){ const w=wm*g.s; for(let i=0;i<bands;i++){ c.fillStyle=i%2?'#7cc576':'#86cc80'; c.fillRect(g.x0+i*w/bands,g.y0,w/bands+1,hm*g.s); } }
function stadium(c,cx,cy,st,r){ c.beginPath(); c.moveTo(cx-st/2,cy-r); c.lineTo(cx+st/2,cy-r); c.arc(cx+st/2,cy,r,-Math.PI/2,Math.PI/2); c.lineTo(cx-st/2,cy+r); c.arc(cx-st/2,cy,r,Math.PI/2,Math.PI*1.5); c.closePath(); }
function label(c,t,x,y,col='#1f2544',sz=14,al='center'){ c.fillStyle=col; c.font=`bold ${sz}px Nunito,system-ui,sans-serif`; c.textAlign=al; c.textBaseline='middle'; c.fillText(t,x,y); c.textAlign='left'; c.textBaseline='alphabetic'; }

function drawBg(ctx,type){

    const [wm,hm]=type==='gymR'?[44,24]:[30,30]; const g=fitM(wm,hm,22);
    c.fillStyle='#d6d9e3'; c.fillRect(0,0,W,H);

    c.fillStyle='#fff'; c.fillRect(g.X(wm)-4,g.Y(hm/2-1),8,2*g.s); c.fillRect(g.X(0)-4,g.Y(hm/2-1),8,2*g.s);  // portes

  }

  if(type==='basket'){

    planks(c,g.x0,g.y0,28*g.s,15*g.s,'#eecb94','#e0b87a');

    const side=m=>{ const X=v=>g.X(m?28-v:v), Y=g.Y, a=Math.asin(6.6/6.75), s0=m?Math.PI:0;
      c.fillStyle='rgba(229,112,72,.55)'; c.fillRect(Math.min(X(0),X(5.8)),Y(5.05),5.8*g.s,4.9*g.s); c.strokeRect(Math.min(X(0),X(5.8)),Y(5.05),5.8*g.s,4.9*g.s);

      ln(c,X(0),Y(0.9),X(2.99),Y(0.9)); ln(c,X(0),Y(14.1),X(2.99),Y(14.1));
      c.beginPath(); c.arc(X(1.575),Y(7.5),6.75*g.s,s0-a,s0+a); c.stroke();
      c.lineWidth=5; ln(c,X(1.2),Y(6.6),X(1.2),Y(8.4)); c.lineWidth=3;
      c.strokeStyle='#e5532d'; c.beginPath(); c.arc(X(1.575),Y(7.5),0.3*g.s,0,7); c.stroke(); c.strokeStyle=INK; };
    side(0); side(1);
    c.strokeRect(g.x0,g.y0,28*g.s,15*g.s); ln(c,g.X(14),g.Y(0),g.X(14),g.Y(15)); c.beginPath(); c.arc(g.X(14),g.Y(7.5),1.8*g.s,0,7); c.stroke();

  if(type==='hand'){

    c.fillStyle='#f6c48f'; c.fillRect(g.X(1),g.Y(0),40*g.s,20*g.s);
    c.strokeStyle=INK; c.lineWidth=3;
    const side=m=>{ const X=v=>g.X(m?41-v:1+v), Y=g.Y, d=m?-1:1;
      const zone=r=>{ c.beginPath(); c.moveTo(X(0),Y(8.5-r)); c.arc(X(0),Y(8.5),r*g.s,m?Math.PI*1.5:-Math.PI/2,m?Math.PI:0,!!m); c.lineTo(X(r),Y(11.5)); c.arc(X(0),Y(11.5),r*g.s,m?Math.PI:0,m?Math.PI/2:Math.PI/2,!!m); };

  if(type==='foot'){

function addItem(text, k, comp){
  const f=F(); if(!f) return;
  const inp=$('#itemIn'); text = text ?? inp?.value; if(!text||!text.trim()) return;
  f.items.push({id:uid(), kind:k||kind, text:text.trim(), comp: comp ?? ($('#itemComp')?.value||'')});
  save(); refreshMain(); const i2=$('#itemIn'); if(i2 && !k) i2.focus();
}

/* =========================================================
   BUBBLE (conseils)
   ========================================================= */
function renderBubble(){
  let fab=$('#fab'); if(!fab){ fab=document.createElement('button'); fab.id='fab'; fab.className='fab'; fab.dataset.act='bubble'; fab.title='Conseils'; fab.textContent='💡'; document.body.appendChild(fab); }
  let fb=$('#fabB'); if(!fb){ fb=document.createElement('button'); fb.id='fabB'; fb.className='fab fabB'; fb.dataset.act='pickBrick'; fb.title='Poser une brique (grille des paliers)'; fb.textContent='🧱'; document.body.appendChild(fb); }
  fb.classList.toggle('hidden', view!=='obs');
  let b=$('#bubble'); if(!bubbleOpen){ b&&b.remove(); fab.textContent='💡'; return; }
  fab.textContent='✕';
  if(!b){ b=document.createElement('div'); b.id='bubble'; b.className='bubble'; document.body.appendChild(b); }
  const themes=[...new Set(S.conseils.map(c=>c.theme))];
  const q=bubbleQ.toLowerCase();
  const list=S.conseils.filter(c=>(!bubbleTheme||c.theme===bubbleTheme)&&(!q||c.text.toLowerCase().includes(q)));
  const target = view==='obs' ? (curFrame==='__synth'?'la synthèse':(F()?'« '+F().title+' »':'')) : '';
  b.innerHTML=`<div class="bh"><b>💡 Conseils</b> ${target?`<span class="muted" style="font-size:12px">→ insérer dans ${esc(target)}</span>`:''}
    <input id="bq" placeholder="Rechercher…" value="${esc(bubbleQ)}" style="margin-top:8px">
    <div class="themes"><button class="${!bubbleTheme?'on':''}" data-act="bTheme" data-t="">Tous</button>${themes.map(t=>`<button class="${bubbleTheme===t?'on':''}" data-act="bTheme" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div></div>
    <div class="bl">${list.map(c=>`<div class="cs"><span>${esc(c.text)}</span>${target?`<button class="sm pri" data-act="insConseil" data-id="${c.id}">Insérer</button>`:''}</div>`).join('')||'<p class="muted">Aucun conseil.</p>'}
      <div style="border-top:1px dashed var(--line);padding-top:8px;margin-top:6px">
        <textarea id="newC" style="min-height:60px" placeholder="Nouveau conseil personnalisé…"></textarea>
        <div class="row" style="margin-top:6px"><input id="newCT" placeholder="Thème" style="flex:1" value="${esc(bubbleTheme||'Perso')}"><button class="sm" data-act="saveConseil">＋ Bibliothèque</button>${target?`<button class="sm pri" data-act="saveInsConseil">＋ et insérer</button>`:''}</div>
      </div></div>`;
  const bq=$('#bq'); bq.oninput=()=>{ bubbleQ=bq.value; const pos=bq.selectionStart; renderBubble(); const n=$('#bq'); n.focus(); n.setSelectionRange(pos,pos); };
}
function insertConseil(text){
  if(view!=='obs') return;
  if(curFrame==='__synth'){ const fi=O().final; fi.synth=(fi.synth?fi.synth.trimEnd()+'\n':'')+'💡 '+text; save(); refreshMain(); toast('Conseil ajouté à la synthèse'); return; }
  if(!F()){ toast('Choisis d\'abord un cadre'); return; }
  addItem(text,'conseil',''); toast('Conseil inséré');
}

function modal(html,onOk){
  const bg=document.createElement('div'); bg.className='modalbg';
  bg.innerHTML=`<div class="modal">${html}<div class="row" style="margin-top:16px;justify-content:flex-end"><button data-x="c">Annuler</button><button class="pri" data-x="ok">Valider</button></div></div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click',e=>{ if(e.target===bg||e.target.dataset.x==='c') bg.remove(); if(e.target.dataset.x==='ok'){ if(onOk(bg)!==false) bg.remove(); } });
  const f=bg.querySelector('input,select'); f&&f.focus();
  return bg;
}

/* =========================================================
   DRAWER (Drive / EDT)
   ========================================================= */
function previewUrl(u){
  if(!u) return u; let m;
  if((m=u.match(/docs\.google\.com\/(document|presentation|spreadsheets)\/d\/([\w-]+)/))) { const tab=(u.match(/[?&]tab=([\w.-]+)/)||[])[1]; return `https://docs.google.com/${m[1]}/d/${m[2]}/preview`+(tab?`?tab=${tab}`:''); }
  if((m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))) return `https://drive.google.com/file/d/${m[1]}/preview`;
  if((m=u.match(/drive\.google\.com\/drive\/(?:u\/\d+\/)?folders\/([\w-]+)/))) return `https://drive.google.com/embeddedfolderview?id=${m[1]}#list`;
  return u;
}
function openDrawer(title,url){
  if(!url){ toast('Aucun lien renseigné'); return; }
  $('#drawerT').textContent=title; $('#drawerA').href=url; $('#drawerF').src=previewUrl(url); $('#drawer').classList.add('open');
}

/* =========================================================
   RATTRAPAGE DU TEMPS (chrono oublié / phase commencée plus tôt)
   ========================================================= */
const MIN=60000;
const clockAt = msAgo => new Date(Date.now()-msAgo).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
/* décale tout le chronométrage de d ms : le chrono avance, les phases gardent leurs heures réelles */
function addChrono(o,d){
  if(d<0) d=-Math.min(-d, Math.min(elapsed(o), ...o.frames.filter(x=>x.start!=null).map(x=>x.start)));
  o.chrono.acc+=d; o.frames.forEach(x=>{ lapsOf(x).forEach(l=>{ l.s+=d; if(l.e!=null) l.e+=d; }); syncFrame(x); });
  return d;
}
function setPhaseStart(o,f,ns){
  if(!o.chrono.startedAt) o.chrono.startedAt=Date.now();
  if(ns<0) ns+=addChrono(o,-ns);            // pas assez de chrono : on l'avance d'autant
  const now=elapsed(o); ns=Math.max(0,Math.min(ns,now));
  const L=lapsOf(f);
  if(!L.length) L.push({k:defaultKind(f),s:ns});                    // phase oubliée : elle tourne depuis ns
  else { L.sort((a,b)=>a.s-b.s); L[0].s=Math.min(ns, L[0].e??ns); }  // on décale le début de la 1re séquence
  syncFrame(f);
  o.frames.forEach(x=>{ if(x===f||!lapsOf(x).length) return;
    if(x.start<ns && (x.end==null || x.end>ns)) closeFrame(x,ns);   // la phase précédente s'arrête au nouveau début
    else if(openLapOf(f) && openLapOf(x)) closeFrame(x,now); });     // une seule phase en cours à la fois
  f.clock=clockAt(now-f.start);
}

function packetFor(obsList, trs){

async function sendPacket(obsList, trs, title, fname){

    ${dropped?`<p>⚠️ ${dropped} ancien${dropped>1?'s':''} croquis (format image) ne voyage${dropped>1?'nt':''} pas par QR : utilise l'envoi en fichier.</p>`:''}

function applyPacket(p){
  if(!p||p.a!==APP_ID){ toast('⚠️ Ce QR / fichier ne vient pas de l\'appli Visites stagiaires'); return false; }
  const idMap={}; let nt=0,no=0,nr=0,ns=0;
  (p.t||[]).forEach(t=>{ if(!t) return; let ex=trainee(t.id);
    if(!ex){ const same=S.trainees.find(x=>x.name.trim().toLowerCase()===(t.name||'').trim().toLowerCase()); if(same){ idMap[t.id]=same.id; ex=same; } }
    if(!ex){ S.trainees.push(t); nt++; } else if((t.u||0)>(ex.u||0)){ const keep=ex.id; Object.assign(ex,t,{id:keep}); } });
  (p.o||[]).forEach(o=>{ if(idMap[o.traineeId]) o.traineeId=idMap[o.traineeId];
    o.frames.forEach(f=>{ if(!f.strokes) f.strokes=[]; lapsOf(f); }); if(!o.bricks) o.bricks=[];
    const i=S.obs.findIndex(x=>x.id===o.id);
    if(i<0){ S.obs.push(o); no++; return; }
    const ex=S.obs[i];
    if((o.u||0)===(ex.u||0)){ ns++; return; }
    if((ex.u||0)>(o.u||0) && !confirm(`La visite « L${ex.lesson||'?'} ${ex.apsa||''} du ${shortDate(ex.date)} » a été modifiée plus récemment sur cet appareil.

La remplacer quand même par la version reçue ?`)){ ns++; return; }
    o.frames.forEach(f=>{ const ef=ex.frames.find(x=>x.id===f.id); if(ef&&ef.drawing&&!f.drawing) f.drawing=ef.drawing; });
    S.obs[i]=o; nr++; });
  if(p.ref && p.ref!==S.settings.ref && confirm('Le référentiel de compétences de l\'autre appareil est différent. Le reprendre sur celui-ci ?')) S.settings.ref=p.ref;
  save(true,true);
  const msg=[no&&`${no} visite${no>1?'s':''} ajoutée${no>1?'s':''}`,nr&&`${nr} mise${nr>1?'s':''} à jour`,ns&&`${ns} déjà à jour ou gardée${ns>1?'s':''}`,nt&&`${nt} stagiaire${nt>1?'s':''} ajouté${nt>1?'s':''}`].filter(Boolean).join(' · ')||'Rien de nouveau';
  toast('📥 '+msg);
  const one=(p.o||[]).length===1 && (no||nr) ? p.o[0].id : null;
  if(one){ cur=one; curFrame=O().frames[0]?.id||'__synth'; view='obs'; } else if(view==='obs'&&!O()) view='home';
  render(); return true;
}

  O().bricks.push({id:uid(),comp:code,text,p}); save();

  mail(){ const m=mailLink();
    const bg=modal(`<h2>✉️ Envoyer le bilan</h2>
      <p class="muted" style="font-size:14px">1. Génère le PDF (🖨 Bilan PDF → « Enregistrer au format PDF »).<br>2. Ouvre le mail pré-rempli et joins le PDF.</p>
      <label>Destinataire</label><input value="${esc(m.to)}" readonly><label>Objet</label><input value="${esc(m.subj)}" readonly>
      <label>Message</label><textarea readonly style="min-height:180px">${esc(m.body)}</textarea>
      <div class="row" style="margin-top:10px"><button data-act="pdf">🖨 Générer le PDF</button><a href="${m.href}"><button class="pri">Ouvrir dans ma messagerie</button></a><button id="cpy">Copier le texte</button></div>`,()=>true);
    bg.querySelector('#cpy').onclick=()=>{ navigator.clipboard?.writeText(m.body).then(()=>toast('Copié'),()=>toast('Copie impossible')); };
  },
  bubble(){ bubbleOpen=!bubbleOpen; renderBubble(); },
  bTheme(b){ bubbleTheme=b.dataset.t; renderBubble(); },
  insConseil(b){ const c=S.conseils.find(x=>x.id===b.dataset.id); if(c) insertConseil(c.text); },
  saveConseil(){ const t=$('#newC').value.trim(); if(!t) return; S.conseils.push({id:uid(),theme:$('#newCT').value.trim()||'Perso',text:t}); save(); renderBubble(); toast('Ajouté à la bibliothèque'); return t; },
  saveInsConseil(){ const t=ACT.saveConseil(); if(t) insertConseil(t); },
  delConseil(b){ S.conseils=S.conseils.filter(c=>c.id!==b.dataset.id); save(); render(); },
  resetRef(){ if(confirm('Rétablir le référentiel 2013 ?')){ S.settings.ref=DEFAULT_REF; save(); render(); } },
  export(){ const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`neps-stagiaires-${today()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); },
  import(){ $('#importFile').click(); },
  wipe(){ if(confirm('Effacer TOUTES les données de cet appareil ?')&&confirm('Vraiment ? Exporte d\'abord si besoin.')){ S=seed(); save(true); view='home'; render(); } },
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const f=ACT[b.dataset.act]; if(f) f(b,e);
});
function bindValue(el){
  const k=el.dataset.k; if(!k) return; const [key,arg]=k.split(':');
  const v = el.type==='checkbox'?el.checked : el.isContentEditable? el.innerText : el.value;
  const o=O(), f=F();
  switch(key){
    case 'set.tutor': S.settings.tutor=v; break;
    case 'set.school': S.settings.school=v; break;
    case 'set.edtUrl': S.settings.edtUrl=v.trim(); break;
    case 'set.autoPhase': S.settings.autoPhase=!!v; break;
    case 'set.seuil': S.settings.seuil=Math.max(1,+v||5); break;
    case 'set.ref': S.settings.ref=v; break;
    case 'f.title': f.title=v; refreshNav(); break;
    case 'f.text': f.text=v; break;
    case 'f.bg': f.bg=v; drawBg($('#bgC').getContext('2d'),v); break;
    case 'it.text': f.items[+arg].text=v; break;
    case 'it.comp': f.items[+arg].comp=v; break;
    case 'priv': o.private=v; break;
    case 'fin.synth': o.final.synth=v; break;
    case 'fin.forts': o.final.forts=v; break;
    case 'ax.text': o.final.axes[+arg].text=v; break;
    case 'ax.comp': o.final.axes[+arg].comp=v; break;
    case 'ax.prio': o.final.axes[+arg].prio=v; break;
    case 'br.text': o.bricks[+arg].text=v; break;
    case 'cmp.note': o.comps[arg]=o.comps[arg]||{lvl:0,note:''}; o.comps[arg].note=v; break;
  }
  save();
}
document.addEventListener('input',e=>bindValue(e.target));
document.addEventListener('change',e=>{ if(e.target.matches('select,input[type=checkbox]')) bindValue(e.target); });
$('#pktFile').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.a!==APP_ID) throw 0; const sh=document.querySelector('.modalbg'); sh&&sh.close&&sh.close(); applyPacket(d); }catch(_){ toast('Fichier non reconnu'); } };
  r.readAsText(file); e.target.value='';
});
$('#importFile').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.a===APP_ID){ applyPacket(d); return; } if(!d.trainees||!d.obs) throw 0; if(!confirm('Remplacer les données actuelles par ce fichier ?')) return; S=d; migrate(); save(true); view='home'; render(); toast('Import réussi'); }catch(_){ toast('Fichier invalide'); } };
  r.readAsText(file); e.target.value='';
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const sh=document.querySelector('.modalbg'); if(sh&&sh.close) sh.close(); if(bubbleOpen){bubbleOpen=false;renderBubble();} const d=$('#drawer'); d&&d.classList.remove('open'); } });
window.addEventListener('beforeprint',()=>{ if($('#print').innerHTML) return; if(view==='obs') buildPrint(); else if(view==='wall') buildWallPrint(); });
window.addEventListener('afterprint',()=>{ $('#print').innerHTML=''; });
window.addEventListener('pagehide',()=>save(true));

render();

/* ---------- PWA ---------- */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{ const w=reg.installing; w&&w.addEventListener('statechange',()=>{ if(w.state==='installed'&&navigator.serviceWorker.controller) toast('Nouvelle version disponible : recharge la page'); }); });
  }).catch(()=>{});
}
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; const top=document.querySelector('.top .grow'); if(view==='home'&&top&&!document.getElementById('instBtn')){ const b=document.createElement('button'); b.id='instBtn'; b.textContent='⤓ Installer'; b.onclick=async()=>{ installEvt.prompt(); await installEvt.userChoice; installEvt=null; b.remove(); }; top.after(b); } });
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
</script>
</body>
</html>
