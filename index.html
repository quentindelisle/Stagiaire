<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e293b">
<title>N'EPS · Visites stagiaires</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stagiaires">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--accent:#1e293b;
  --pem:#6366f1;--echauf:#f59e0b;--sit:#10b981;--bi:#0ea5e9;--bf:#e11d48;
  --fort:#16a34a;--vig:#ea580c;--secu:#dc2626;--conseil:#2563eb;--obs:#64748b;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;min-height:40px}
button:hover{background:#f8fafc}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
button.pri:hover{background:#334155}
button.ghost{border-color:transparent;background:transparent}
button.danger{color:var(--secu)}
button.sm{min-height:32px;padding:4px 10px;font-size:13px}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%}
textarea{resize:vertical;min-height:90px;line-height:1.45}
input:focus,select:focus,textarea:focus,[contenteditable]:focus{outline:2px solid #93c5fd;outline-offset:1px}
label{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.03em;display:block;margin:10px 0 4px}
h1,h2,h3{margin:0}
.muted{color:var(--mute)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-weight:600;white-space:nowrap}
.hidden{display:none!important}

/* ---------- Top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.top button:hover{background:rgba(255,255,255,.18)}
.brand{font-weight:800;letter-spacing:.02em}
.brand small{font-weight:500;opacity:.7}
.ctx{font-weight:600;line-height:1.15}
.ctx small{display:block;font-weight:400;opacity:.75;font-size:12px}
.chrono{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);border-radius:12px;padding:4px 6px 4px 12px}
.chrono .t{font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;min-width:84px;text-align:center}
.chrono button{min-height:36px;padding:4px 10px}
.measure.on{background:#f59e0b!important;border-color:#f59e0b!important;color:#111!important}

/* ---------- Home ---------- */
.wrap{max-width:1150px;margin:0 auto;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tcard h3{font-size:18px}
.axe{border-left:4px solid var(--bf);background:#fff1f2;border-radius:8px;padding:6px 10px;margin:6px 0;font-size:14px}
.hist{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.hist .h{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:14px}
.hist .h span{flex:1}
.empty{text-align:center;padding:40px;color:var(--mute)}

/* ---------- Obs layout ---------- */
.banner{background:#fff;border-bottom:1px solid var(--line);padding:8px 14px}
.banner .ax{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:4px 0}
.banner .ax .txt{flex:1;min-width:220px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:32px;padding:4px 10px;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.layout{display:grid;grid-template-columns:250px 1fr;gap:14px;padding:14px;max-width:1400px;margin:0 auto}
.nav{display:flex;flex-direction:column;gap:6px}
.nav .it{display:flex;align-items:center;gap:8px;text-align:left;border-left:6px solid var(--c,#94a3b8);padding:8px 10px;justify-content:flex-start}
.nav .it.on{background:#0f172a;color:#fff;border-color:#0f172a;border-left-color:var(--c,#94a3b8)}
.nav .it .n{flex:1;line-height:1.2}
.nav .it small{display:block;font-size:11px;opacity:.7}
.nav .it .cnt{font-size:11px;background:rgba(100,116,139,.18);border-radius:999px;padding:1px 7px}
.nav hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.main{min-width:0}
.fhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-left:8px solid var(--c);padding-left:12px;margin-bottom:10px}
.fhead input.title{font-size:20px;font-weight:700;border-color:transparent;background:transparent;padding:4px 6px;width:auto;flex:1;min-width:200px}
.fhead input.title:hover{border-color:var(--line)}
.timing{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.sec{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.sec>h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.kinds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.kinds button{min-height:34px;padding:4px 10px;font-size:13px;border-width:2px}
.kinds button.on{color:#fff}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1;min-width:220px}
.addrow select{width:auto;max-width:200px}
.items{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.item{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:#f8fafc;border-left:4px solid var(--k)}
.item .ic{font-size:16px;line-height:1.4}
.item .tx{flex:1;line-height:1.4;min-height:1.4em;white-space:pre-wrap}
.item select{width:auto;font-size:12px;padding:2px 4px;border-radius:6px}
.item.conseil{background:#eff6ff;border:1px solid #bfdbfe;border-left:4px solid var(--conseil);border-radius:14px 14px 14px 4px;position:relative}
.item button{min-height:28px;padding:0 8px}

/* ---------- Canvas ---------- */
.draw{position:relative;width:100%;aspect-ratio:1000/560;border:1px solid var(--line);border-radius:10px;overflow:hidden;touch-action:none;background:#fff}
.draw canvas{position:absolute;inset:0;width:100%;height:100%}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.sw{width:34px;height:34px;min-height:34px;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--accent)}
.tools .sz.on,.tools .tl.on{background:var(--accent);color:#fff}

/* ---------- Competences ---------- */
.comp{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.comp .code{font-weight:800}
.comp .lab{font-size:14px}
.comp .ev{grid-column:2/4;font-size:12px;color:var(--mute)}
.comp input{grid-column:2/4;padding:6px 9px;font-size:14px}
.lv button.on[data-l="1"]{background:#dc2626;color:#fff}
.lv button.on[data-l="2"]{background:#ea580c;color:#fff}
.lv button.on[data-l="3"]{background:#16a34a;color:#fff}
.lv button.on[data-l="0"]{background:#64748b;color:#fff}
.group{margin-top:14px;font-weight:700;color:var(--mute);font-size:12px;text-transform:uppercase}

/* ---------- Drawer / modal / bubble ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100vw);background:#fff;z-index:40;box-shadow:-10px 0 30px rgba(0,0,0,.2);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .25s}
.drawer.open{transform:none}
.drawer .dh{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}
.drawer iframe{flex:1;border:0;width:100%}
.modalbg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal{background:#fff;border-radius:16px;max-width:620px;width:100%;padding:18px}
.modal h2{margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fab{position:fixed;right:18px;bottom:36px;z-index:30;width:62px;height:62px;border-radius:50%;font-size:28px;background:#2563eb;color:#fff;border:0;box-shadow:0 8px 24px rgba(37,99,235,.45)}
.fab:hover{background:#1d4ed8}
.bubble{position:fixed;right:18px;bottom:110px;z-index:31;width:min(400px,calc(100vw - 36px));max-height:70vh;background:#fff;border:1px solid #bfdbfe;border-radius:20px 20px 6px 20px;box-shadow:0 18px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.bubble .bh{padding:12px 14px;background:#eff6ff;border-bottom:1px solid #bfdbfe}
.bubble .bl{overflow:auto;padding:8px 10px;flex:1}
.bubble .cs{padding:8px 10px;border-radius:12px;border:1px solid var(--line);margin-bottom:6px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.bubble .cs span{flex:1}
.bubble .themes{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.bubble .themes button{min-height:28px;padding:2px 8px;font-size:12px}
.bubble .themes button.on{background:#2563eb;color:#fff;border-color:#2563eb}
.sign{position:fixed;right:12px;bottom:6px;z-index:29;font-size:12px;color:#64748b;pointer-events:none;letter-spacing:.02em;background:rgba(241,245,249,.85);padding:1px 6px;border-radius:6px}
.sign b{color:#1e293b}
.brand{display:flex;align-items:center;gap:8px}
.brand img{width:32px;height:32px;border-radius:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .nav .it{min-width:150px}
  .nav hr{display:none}
  .two{grid-template-columns:1fr}
  .chrono .t{font-size:20px;min-width:70px}
}

/* ---------- PRINT ---------- */
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:10.5pt}
  #app,.fab,.bubble,.sign,.drawer,.modalbg,.toast{display:none!important}
  #print{display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.p-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #0f172a;padding-bottom:6px;margin-bottom:10px}
.p-head h1{font-size:18pt}
.p-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 14px;font-size:10pt;margin-bottom:10px}
.p-meta b{color:#475569;font-weight:600}
.p-box{border:1px solid #cbd5e1;border-radius:8px;padding:8px 10px;margin:8px 0;break-inside:avoid}
.p-h2{font-size:12pt;font-weight:800;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.03em}
.p-frame{border-left:5px solid var(--c);padding:4px 0 4px 10px;margin:10px 0;break-inside:avoid-page}
.p-frame h3{font-size:12pt;display:flex;justify-content:space-between}
.p-frame h3 small{font-weight:400;color:#64748b;font-size:9.5pt}
.p-txt{white-space:pre-wrap;margin:4px 0}
.p-it{margin:3px 0;padding:3px 8px;border-left:3px solid var(--k);background:#f8fafc;break-inside:avoid}
.p-it.conseil{background:#eff6ff;border:1px solid #bfdbfe;border-left:3px solid #2563eb;border-radius:10px 10px 10px 2px}
.p-img{max-width:100%;max-height:85mm;border:1px solid #e2e8f0;border-radius:6px;margin-top:4px}
.p-tl{display:flex;height:16px;border-radius:4px;overflow:hidden;margin:4px 0 2px}
.p-tl div{color:#fff;font-size:7.5pt;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
.p-table{width:100%;border-collapse:collapse;font-size:9.5pt}
.p-table td,.p-table th{border:1px solid #cbd5e1;padding:4px 6px;text-align:left;vertical-align:top}
.p-lv{font-weight:700;white-space:nowrap}
.p-axe{border:2px solid #e11d48;border-radius:8px;padding:6px 10px;margin:6px 0;break-inside:avoid}
.p-foot{margin-top:18px;display:flex;justify-content:space-between;font-size:9pt;color:#64748b;border-top:1px solid #cbd5e1;padding-top:6px}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
<div class="sign">N'EPS · by <b>Quentin Delisle</b></div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden">

<script>
/* =========================================================
   N'EPS · Visites stagiaires — by Quentin Delisle
   Données stockées localement (localStorage) — export JSON possible
   ========================================================= */
const LS = 'neps-stagiaires-v1';

const TYPES = {
  pem:    {l:'Prise en main',        c:'var(--pem)',    hex:'#6366f1', r:0},
  echauf: {l:'Échauffement',         c:'var(--echauf)', hex:'#f59e0b', r:1},
  sit:    {l:'Situation de travail', c:'var(--sit)',    hex:'#10b981', r:2},
  bi:     {l:'Bilan intermédiaire',  c:'var(--bi)',     hex:'#0ea5e9', r:3},
  bf:     {l:'Bilan final',          c:'var(--bf)',     hex:'#e11d48', r:4},
};
const KINDS = {
  obs:     {l:'Observation', ic:'📝', c:'#64748b'},
  fort:    {l:'Point fort',  ic:'✅', c:'#16a34a'},
  vig:     {l:'Vigilance',   ic:'⚠️', c:'#ea580c'},
  secu:    {l:'Sécurité',    ic:'🛑', c:'#dc2626'},
  conseil: {l:'Conseil',     ic:'💡', c:'#2563eb'},
};
const LEVELS = ['Non observé','À construire','En cours','Acquis'];
const LV_COL = ['#64748b','#dc2626','#ea580c','#16a34a'];
const AX_STATUS = ['À observer','Non travaillé','En progrès','Atteint'];

const DEFAULT_REF = `## Compétences communes à tous les professeurs et personnels d'éducation
CC1 | Faire partager les valeurs de la République
CC2 | Inscrire son action dans le cadre des principes fondamentaux du système éducatif et dans le cadre réglementaire de l'école
CC3 | Connaître les élèves et les processus d'apprentissage
CC4 | Prendre en compte la diversité des élèves
CC5 | Accompagner les élèves dans leur parcours de formation
CC6 | Agir en éducateur responsable et selon des principes éthiques
CC7 | Maîtriser la langue française à des fins de communication
CC8 | Utiliser une langue vivante étrangère dans les situations exigées par son métier
CC9 | Intégrer les éléments de la culture numérique nécessaires à l'exercice de son métier
CC10 | Coopérer au sein d'une équipe
CC11 | Contribuer à l'action de la communauté éducative
CC12 | Coopérer avec les parents d'élèves
CC13 | Coopérer avec les partenaires de l'école
CC14 | S'engager dans une démarche individuelle et collective de développement professionnel
## Compétences communes à tous les professeurs
P1 | Maîtriser les savoirs disciplinaires et leur didactique
P2 | Maîtriser la langue française dans le cadre de son enseignement
P3 | Construire, mettre en œuvre et animer des situations d'enseignement et d'apprentissage prenant en compte la diversité des élèves
P4 | Organiser et assurer un mode de fonctionnement du groupe favorisant l'apprentissage et la socialisation des élèves
P5 | Évaluer les progrès et les acquisitions des élèves`;

const DEFAULT_CONSEILS = [
  ['Organisation','Anticipe au maximum l\'installation du matériel pour te libérer du « temps de cerveau » et sortir du rôle de prof organisateur.'],
  ['Organisation','Fais installer le matériel pendant l\'échauffement par un ou plusieurs élèves, en faisant tourner les rôles : tu gagnes du temps.'],
  ['Organisation','Décale les groupes dans le temps : un groupe installe pendant que l\'autre s\'échauffe, puis donne les consignes au groupe prêt.'],
  ['Consignes','Lance un groupe dès que sa consigne est donnée, avant d\'expliquer la tâche suivante à l\'autre groupe : évite les temps de flottement.'],
  ['Consignes','Sanctuarise une zone de transmission des consignes (ex. devant le miroir, au bord du bassin) : un lieu = un moment d\'écoute.'],
  ['Consignes','Ajuste la complexité des consignes et du vocabulaire à la capacité d\'écoute des élèves. Commence par le nouveau, pas par ce qu\'ils connaissent déjà.'],
  ['Consignes','Pendant que tu parles, regarde les élèves : pas seulement pour voir s\'ils écoutent, mais pour vérifier qu\'ils comprennent.'],
  ['Consignes','Montre tes attendus par une démonstration : un élève pratiquant, un élève observateur.'],
  ['Voix / placement','Place ta voix et resserre le groupe lors des regroupements, surtout dans un milieu bruyant (piscine, gymnase).'],
  ['Sécurité','Anticipe les comportements des élèves : que se passe-t-il si tous les groupes chutent en même temps ? Gère l\'espace entre les ateliers.'],
  ['Sécurité','Donne aux pareurs des contenus d\'action précis et des règles générales, pas seulement un rôle.'],
  ['Rôles sociaux','Donne un support et de l\'importance aux observateurs/juges : cela engage les élèves dans la tâche. Et exploite leurs retours.'],
  ['Rôles sociaux','Sur ta fiche, indique ce que tu veux réellement voir et organise le dispositif pour cet objectif : comment regarder, quoi regarder, comment noter.'],
  ['Contenus','L\'échauffement est une occasion majeure de donner du contenu moteur et de préparer spécifiquement à la situation.'],
  ['Gestion de classe','Prends en charge le vestiaire : c\'est un temps fort pour réguler et rassurer.'],
  ['Bilan','Termine toujours par un passage devant au moins un petit public : engager les élèves dans un processus de démonstration.'],
  ['Bilan','Explique le POURQUOI des contenus : à quoi ça sert, en quoi c\'est essentiel pour le champ d\'apprentissage.'],
  ['Co-intervention','En co-intervention, répartissez-vous les rôles (contenus / ambiance et recueil de données) pour être tous deux concernés par l\'évènement.'],
];

/* ---------- Utils ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ms => { ms=Math.max(0,ms||0); const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0'); };
const fmtShort = ms => { const s=Math.round((ms||0)/1000); return Math.floor(s/60)+"'"+String(s%60).padStart(2,'0'); };
const frDate = d => d ? new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}) : '';
const shortDate = d => d ? new Date(d+'T12:00').toLocaleDateString('fr-FR') : '';
const today = () => new Date().toISOString().slice(0,10);
const firstName = n => (n||'').trim().split(/\s+/)[0]||'';
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

/* ---------- State ---------- */
function seed(){
  return {
    v:1,
    settings:{ tutor:'Quentin Delisle', school:'Lycée Monge La Chauvinière — Nantes', edtUrl:'https://quentindelisle.github.io/EDT/', ref:DEFAULT_REF },
    conseils: DEFAULT_CONSEILS.map(([theme,text])=>({id:uid(),theme,text})),
    trainees:[], obs:[]
  };
}
function load(){ try{ const j=localStorage.getItem(LS); return j?JSON.parse(j):null; }catch(e){ return null; } }
let S = load() || seed();
if(S.settings && !S.settings.edtUrl){ S.settings.edtUrl='https://quentindelisle.github.io/EDT/'; }
let saveT=null;
function save(now){
  clearTimeout(saveT);
  const go=()=>{ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){ toast('⚠️ Stockage plein : exporte puis supprime d\'anciennes visites.'); } };
  now?go():saveT=setTimeout(go,300);
}
function refList(){
  const out=[]; let g='';
  (S.settings.ref||'').split('\n').forEach(l=>{
    l=l.trim(); if(!l) return;
    if(l.startsWith('##')){ g=l.replace(/^#+\s*/,''); return; }
    const [code,...rest]=l.split('|'); if(!rest.length) return;
    out.push({code:code.trim(),label:rest.join('|').trim(),group:g});
  });
  return out;
}
const compLabel = code => { const c=refList().find(x=>x.code===code); return c?c.label:''; };
const compOptions = (sel,empty='Compétence…') => `<option value="">${empty}</option>`+refList().map(c=>`<option value="${esc(c.code)}" ${c.code===sel?'selected':''}>${esc(c.code)} — ${esc(c.label.slice(0,60))}${c.label.length>60?'…':''}</option>`).join('');

const trainee = id => S.trainees.find(t=>t.id===id);
const obsOf = tid => S.obs.filter(o=>o.traineeId===tid).sort((a,b)=>(b.date+b.created).localeCompare(a.date+a.created));
function currentAxes(tid, exceptId){
  const last = obsOf(tid).find(o=>o.id!==exceptId && (o.final?.axes||[]).some(a=>a.text.trim()));
  if(last) return {from:`${last.apsa||''} L${last.lesson||'?'} du ${shortDate(last.date)}`, axes:last.final.axes.filter(a=>a.text.trim())};
  const t=trainee(tid); return {from:'fixés manuellement', axes:(t?.axes||[]).filter(a=>a.text.trim())};
}

/* ---------- Chrono ---------- */
function elapsed(o){ o=o||O(); if(!o) return 0; const c=o.chrono; return c.acc + (c.startedAt? Date.now()-c.startedAt : 0); }
setInterval(()=>{
  const o=O(); if(!o||view!=='obs') return;
  const t=$('#chronoT'); if(t) t.textContent=fmt(elapsed(o));
  const m=$('#measureBtn'); if(m&&measureStart!==null) m.textContent='⏹ '+fmtShort(elapsed(o)-measureStart);
  const tm=$('#timing'); if(tm) tm.innerHTML=timingHTML(F());
},500);

/* ---------- Drawing ---------- */
let undoStack=[];
function drawBg(ctx,type){
  const W=1000,H=560; ctx.clearRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  ctx.lineWidth=2;
  if(type==='grid'){ ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1; for(let x=0;x<=W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();} for(let y=0;y<=H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();} }
  if(type==='gym'){ ctx.fillStyle='#fef3c7'; ctx.fillRect(0,0,W,H); ctx.strokeStyle='#92400e'; ctx.lineWidth=3; ctx.strokeRect(40,40,W-80,H-80); ctx.beginPath(); ctx.moveTo(W/2,40); ctx.lineTo(W/2,H-40); ctx.stroke(); ctx.beginPath(); ctx.arc(W/2,H/2,70,0,7); ctx.stroke(); }
  if(type==='pool'){ ctx.fillStyle='#bae6fd'; ctx.fillRect(0,40,W,H-80); ctx.fillStyle='#e2e8f0'; ctx.fillRect(0,0,W,40); ctx.fillRect(0,H-40,W,40); const lh=(H-80)/6; for(let i=1;i<6;i++){ const y=40+i*lh; ctx.setLineDash([14,10]); ctx.strokeStyle='#dc2626'; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); } ctx.setLineDash([]); ctx.fillStyle='#0369a1'; ctx.font='bold 20px system-ui'; for(let i=0;i<6;i++) ctx.fillText(String(i+1),10,40+i*lh+lh/2+7); }
}
function setupCanvas(){
  const f=F(); const bg=$('#bgC'), ink=$('#inkC'); if(!bg||!ink||!f) return;
  drawBg(bg.getContext('2d'),f.bg||'blank');
  const ctx=ink.getContext('2d'); ctx.lineCap='round'; ctx.lineJoin='round';
  undoStack=[];
  if(f.drawing){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0); im.src=f.drawing; }
  let drawing=false, last=null, startP=null, snap=null;
  const pos=e=>{ const r=ink.getBoundingClientRect(); return {x:(e.clientX-r.left)*1000/r.width, y:(e.clientY-r.top)*560/r.height}; };
  const style=()=>{ ctx.globalCompositeOperation=pen.tool==='eraser'?'destination-out':'source-over'; ctx.strokeStyle=pen.c; ctx.fillStyle=pen.c; ctx.lineWidth=pen.tool==='eraser'?pen.w*5:pen.w; };
  ink.onpointerdown=e=>{ ink.setPointerCapture(e.pointerId); drawing=true; undoStack.push(ctx.getImageData(0,0,1000,560)); if(undoStack.length>25)undoStack.shift();
    last=startP=pos(e); style(); if(pen.tool==='arrow') snap=ctx.getImageData(0,0,1000,560); else { ctx.beginPath(); ctx.arc(last.x,last.y,ctx.lineWidth/2,0,7); ctx.fill(); } };
  ink.onpointermove=e=>{ if(!drawing) return; const p=pos(e);
    if(pen.tool==='arrow'){ ctx.putImageData(snap,0,0); arrow(ctx,startP,p); }
    else { ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; } };
  const end=()=>{ if(!drawing) return; drawing=false; ctx.globalCompositeOperation='source-over'; storeDraw(); };
  ink.onpointerup=end; ink.onpointercancel=end; ink.onpointerleave=e=>{ if(e.pointerType==='mouse') end(); };
}
function arrow(ctx,a,b){ ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); const ang=Math.atan2(b.y-a.y,b.x-a.x), L=10+ctx.lineWidth*3; ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-L*Math.cos(ang-0.45),b.y-L*Math.sin(ang-0.45)); ctx.lineTo(b.x-L*Math.cos(ang+0.45),b.y-L*Math.sin(ang+0.45)); ctx.closePath(); ctx.fill(); }
function storeDraw(){ const f=F(), ink=$('#inkC'); if(!f||!ink) return; f.drawing=ink.toDataURL('image/png'); save(); refreshNav(); }
function composite(f){ return new Promise(res=>{ const c=document.createElement('canvas'); c.width=1000; c.height=560; const x=c.getContext('2d'); drawBg(x,f.bg||'blank'); if(!f.drawing) return res(c.toDataURL('image/jpeg',.85)); const im=new Image(); im.onload=()=>{ x.drawImage(im,0,0); res(c.toDataURL('image/jpeg',.85)); }; im.onerror=()=>res(null); im.src=f.drawing; }); }

  if((m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))) return `https://drive.google.com/file/d/${m[1]}/preview`;
  if((m=u.match(/drive\.google\.com\/drive\/(?:u\/\d+\/)?folders\/([\w-]+)/))) return `https://drive.google.com/embeddedfolderview?id=${m[1]}#list`;
  return u;
}

  chrono(){ const c=O().chrono; if(c.startedAt){ c.acc+=Date.now()-c.startedAt; c.startedAt=null; } else c.startedAt=Date.now(); save(true); render(); },

    const now=elapsed(o);
    if(f.start!=null && f.end==null){ f.end=now; }
    else { o.frames.forEach(x=>{ if(x.start!=null&&x.end==null) x.end=now; }); f.start=now; f.end=null; f.clock=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }

  addItem(){ addItem(); },
  delItem(b){ F().items.splice(+b.dataset.i,1); save(); refreshMain(); },
  showDraw(){ F().showDraw=true; refreshMain(); },
  penC(b){ pen.c=b.dataset.c; pen.tool='pen'; refreshMain(); },

  penT(b){ pen.tool = pen.tool===b.dataset.t?'pen':b.dataset.t; refreshMain(); },

  clearDraw(){ const f=F(); if(!confirm('Effacer le croquis ?')) return; f.drawing=null; f.showDraw=true; save(); refreshMain(); },
  lvl(b){ const o=O(), c=b.dataset.c; o.comps[c]=o.comps[c]||{lvl:0,note:''}; o.comps[c].lvl=+b.dataset.l; save(); const y=window.scrollY; refreshMain(); window.scrollTo(0,y); },
  axStatus(b){ O().prevAxes[+b.dataset.i].status=+b.dataset.s; save(); render(); },
  refreshAxes(){ const o=O(); const ca=currentAxes(o.traineeId,o.id); o.prevAxes=ca.axes.map(a=>({text:a.text,comp:a.comp,status:0})); o.prevFrom=fromLabel(ca); save(); render(); toast(ca.axes.length?'Axes récupérés':'Aucun axe trouvé'); },
  addAxe(){ O().final.axes.push({text:'',comp:'',prio:false}); save(); refreshMain(); },
  delAxe(b){ O().final.axes.splice(+b.dataset.i,1); save(); refreshMain(); },
  pullForts(){ const o=O(); const f=o.frames.flatMap(x=>x.items.filter(i=>i.kind==='fort').map(i=>'• '+i.text)); if(!f.length) return toast('Aucun point fort noté'); o.final.forts=(o.final.forts?o.final.forts.trimEnd()+'\n':'')+f.join('\n'); save(); refreshMain(); },
  lesson(){ const o=O(); if(!o.lessonUrl){ const t=trainee(o.traineeId); if(t?.lessonDoc) return openDrawer('Leçons — '+t.name,t.lessonDoc); if(t?.drive) return openDrawer('Dossier Drive — '+t.name,t.drive); toast('Ajoute le lien de la leçon (✎ modifier)'); return; } openDrawer('Leçon L'+(o.lesson||'')+' — '+(o.apsa||''),o.lessonUrl); },
  drive(){ const t=trainee(O().traineeId); openDrawer('Dossier Drive — '+t.name,t.drive); },
  edt(){ if(view==='obs') openDrawer('Emploi du temps',S.settings.edtUrl); else window.open(S.settings.edtUrl,'_blank'); },
  closeDrawer(){ $('#drawer').classList.remove('open'); $('#drawerF').src='about:blank'; },
  async pdf(){ await buildPrint(); setTimeout(()=>window.print(),150); },
  mail(){ const m=mailLink();
    const bg=modal(`<h2>✉️ Envoyer le bilan</h2>
      <p class="muted" style="font-size:14px">1. Génère le PDF (🖨 Bilan PDF → « Enregistrer au format PDF »).<br>2. Ouvre le mail pré-rempli et joins le PDF.</p>
      <label>Destinataire</label><input value="${esc(m.to)}" readonly><label>Objet</label><input value="${esc(m.subj)}" readonly>
      <label>Message</label><textarea readonly style="min-height:180px">${esc(m.body)}</textarea>
      <div class="row" style="margin-top:10px"><button data-act="pdf">🖨 Générer le PDF</button><a href="${m.href}"><button class="pri">Ouvrir dans ma messagerie</button></a><button id="cpy">Copier le texte</button></div>`,()=>true);
    bg.querySelector('#cpy').onclick=()=>{ navigator.clipboard?.writeText(m.body).then(()=>toast('Copié'),()=>toast('Copie impossible')); };
  },
  bubble(){ bubbleOpen=!bubbleOpen; renderBubble(); },
  bTheme(b){ bubbleTheme=b.dataset.t; renderBubble(); },
  insConseil(b){ const c=S.conseils.find(x=>x.id===b.dataset.id); if(c) insertConseil(c.text); },
  saveConseil(){ const t=$('#newC').value.trim(); if(!t) return; S.conseils.push({id:uid(),theme:$('#newCT').value.trim()||'Perso',text:t}); save(); renderBubble(); toast('Ajouté à la bibliothèque'); return t; },
  saveInsConseil(){ const t=ACT.saveConseil(); if(t) insertConseil(t); },
  delConseil(b){ S.conseils=S.conseils.filter(c=>c.id!==b.dataset.id); save(); render(); },
  resetRef(){ if(confirm('Rétablir le référentiel 2013 ?')){ S.settings.ref=DEFAULT_REF; save(); render(); } },
  export(){ const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`neps-stagiaires-${today()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); },
  import(){ $('#importFile').click(); },
  wipe(){ if(confirm('Effacer TOUTES les données de cet appareil ?')&&confirm('Vraiment ? Exporte d\'abord si besoin.')){ S=seed(); save(true); view='home'; render(); } },
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const f=ACT[b.dataset.act]; if(f) f(b,e);
});
function bindValue(el){
  const k=el.dataset.k; if(!k) return; const [key,arg]=k.split(':');
  const v = el.type==='checkbox'?el.checked : el.isContentEditable? el.innerText : el.value;
  const o=O(), f=F();
  switch(key){
    case 'set.tutor': S.settings.tutor=v; break;
    case 'set.school': S.settings.school=v; break;
    case 'set.edtUrl': S.settings.edtUrl=v.trim(); break;
    case 'set.ref': S.settings.ref=v; break;
    case 'f.title': f.title=v; refreshNav(); break;
    case 'f.text': f.text=v; break;
    case 'f.bg': f.bg=v; drawBg($('#bgC').getContext('2d'),v); break;
    case 'it.text': f.items[+arg].text=v; break;
    case 'it.comp': f.items[+arg].comp=v; break;
    case 'priv': o.private=v; break;
    case 'fin.synth': o.final.synth=v; break;
    case 'fin.forts': o.final.forts=v; break;
    case 'ax.text': o.final.axes[+arg].text=v; break;
    case 'ax.comp': o.final.axes[+arg].comp=v; break;
    case 'ax.prio': o.final.axes[+arg].prio=v; break;
    case 'cmp.note': o.comps[arg]=o.comps[arg]||{lvl:0,note:''}; o.comps[arg].note=v; break;
  }
  save();
}
document.addEventListener('input',e=>bindValue(e.target));
document.addEventListener('change',e=>{ if(e.target.matches('select,input[type=checkbox]')) bindValue(e.target); });
$('#importFile').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.trainees||!d.obs) throw 0; if(!confirm('Remplacer les données actuelles par ce fichier ?')) return; S=d; save(true); view='home'; render(); toast('Import réussi'); }catch(_){ toast('Fichier invalide'); } };
  r.readAsText(file); e.target.value='';
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(bubbleOpen){bubbleOpen=false;renderBubble();} const d=$('#drawer'); d&&d.classList.remove('open'); } });
window.addEventListener('beforeprint',()=>{ if(view==='obs'&&!$('#print').innerHTML) buildPrint(); });
window.addEventListener('afterprint',()=>{ $('#print').innerHTML=''; });
window.addEventListener('pagehide',()=>save(true));

render();

/* ---------- PWA ---------- */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{ const w=reg.installing; w&&w.addEventListener('statechange',()=>{ if(w.state==='installed'&&navigator.serviceWorker.controller) toast('Nouvelle version disponible : recharge la page'); }); });
  }).catch(()=>{});
}
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; const top=document.querySelector('.top .grow'); if(view==='home'&&top&&!document.getElementById('instBtn')){ const b=document.createElement('button'); b.id='instBtn'; b.textContent='⤓ Installer'; b.onclick=async()=>{ installEvt.prompt(); await installEvt.userChoice; installEvt=null; b.remove(); }; top.after(b); } });
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
</script>
</body>
</html>
