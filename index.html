<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b4bdb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<title>N'EPS · Visites stagiaires</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stagiaires">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#fff6e5;--card:#fff;--ink:#1f2544;--mute:#62668a;--line:#1f2544;--soft:#f3ead6;--accent:#5b4bdb;--yellow:#ffd43b;
  --pem:#7c6cf2;--echauf:#ffb020;--sit:#1fc28b;--bi:#2fb5f0;--bf:#ff4f7b;
  --fort:#1fa463;--vig:#f07a1a;--secu:#e53935;--conseil:#2f6df0;--obs:#62668a;
  --r:18px;--bw:2.5px;--sh:4px 4px 0 var(--ink);--shs:2px 2px 0 var(--ink);
  --fh:"Fredoka","Baloo 2","Comic Sans MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:600;background:var(--bg);background-image:radial-gradient(#efdcb8 1.3px,transparent 1.5px);background-size:22px 22px;color:var(--ink);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:var(--bw) solid var(--ink);background:#fff;border-radius:14px;padding:7px 14px;min-height:42px;font-weight:800;box-shadow:var(--shs);transition:transform .08s,box-shadow .08s,background .15s;white-space:nowrap}
button:hover{background:#fffbea;transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button.pri{background:var(--accent);color:#fff}
button.pri:hover{background:#6b5cf0}
button.hot{background:var(--bf);color:#fff}
button.hot:hover{background:#ff6a90}
button.yel{background:var(--yellow)}
button.ghost{border-color:transparent;background:transparent;box-shadow:none}
button.ghost:hover{background:rgba(31,37,68,.07);box-shadow:none;transform:none}
button.danger{color:var(--secu)}
button.sm{min-height:34px;padding:3px 10px;font-size:13px;border-radius:11px;border-width:2px}
input,select,textarea{border:2px solid var(--ink);border-radius:12px;padding:9px 11px;background:#fff;width:100%;font-weight:600;box-shadow:inset 2px 2px 0 rgba(31,37,68,.07)}
textarea{resize:vertical;min-height:110px;line-height:1.5}
input:focus,select:focus,textarea:focus,[contenteditable]:focus{outline:3px solid var(--yellow);outline-offset:1px}
label{font-family:var(--fh);font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;display:block;margin:12px 0 4px}
h1,h2,h3{margin:0;font-family:var(--fh);font-weight:700}
a{color:var(--accent);font-weight:800}
.muted{color:var(--mute)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 9px;border-radius:999px;background:#ece8ff;color:var(--ink);font-weight:800;white-space:nowrap;border:2px solid var(--ink)}
.hidden{display:none!important}
.lbl{display:inline}

/* ---------- Top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;padding:8px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:3px solid var(--ink);background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0 14px,transparent 14px 28px)}
.top button:not(.pri):not(.hot):not(.yel){background:#fff;color:var(--ink)}
.brand{font-family:var(--fh);font-weight:700;font-size:23px;letter-spacing:.01em;display:flex;align-items:center;gap:10px;text-shadow:2px 2px 0 var(--ink)}
.brand small{font-weight:500;font-size:16px;opacity:.9;text-shadow:none}
.brand img{width:40px;height:40px;border-radius:12px;border:2.5px solid var(--ink);box-shadow:var(--shs);transform:rotate(-5deg);background:#fff}
.ctx{font-family:var(--fh);font-weight:600;font-size:19px;line-height:1.15;text-shadow:1.5px 1.5px 0 var(--ink)}
.ctx small{display:block;font-family:"Nunito",sans-serif;font-weight:700;opacity:.9;font-size:13px;text-shadow:none}
.ctx a{color:var(--yellow)}
.chrono{display:flex;align-items:center;gap:6px;background:var(--yellow);color:var(--ink);border:var(--bw) solid var(--ink);border-radius:18px;padding:4px 6px 4px 14px;box-shadow:var(--shs)}
.chrono.run{background:#7cf2b4;animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:2px 2px 0 var(--ink),0 0 0 6px rgba(124,242,180,.35)}}
.chrono .t{font-family:var(--fh);font-variant-numeric:tabular-nums;font-size:28px;font-weight:700;min-width:96px;text-align:center}
.chrono button{min-height:36px;padding:3px 10px;box-shadow:none;border-width:2px}
.chrono button:hover{box-shadow:none;transform:none}
.mins{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.mins button{min-width:64px;font-family:var(--fh);font-size:17px}
.mins input{width:90px}
.measure.on{background:var(--bf)!important;color:#fff!important}

/* ---------- Home ---------- */
.wrap{padding:22px 28px 60px}
.hero{display:flex;align-items:center;gap:18px;margin-bottom:20px;background:#fff;border:var(--bw) solid var(--ink);border-radius:24px;box-shadow:var(--sh);padding:14px 20px;background-image:radial-gradient(circle at 92% 30%,#fff1b8 0 70px,transparent 71px),radial-gradient(circle at 80% 110%,#e3ddff 0 60px,transparent 61px)}
.hero h2{font-size:30px}
.hero p{margin:2px 0 0}
.hero svg{flex:none}
.stats{display:flex;gap:10px}
.stat{border:2px solid var(--ink);border-radius:14px;padding:4px 12px;text-align:center;background:var(--soft);box-shadow:var(--shs)}
.stat b{display:block;font-family:var(--fh);font-size:24px;line-height:1}
.stat span{font-size:11px;text-transform:uppercase;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:22px}
.card{background:var(--card);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.tcard{position:relative}
.tcard h3{font-size:21px}
.av{width:50px;height:50px;border-radius:50%;border:var(--bw) solid var(--ink);display:grid;place-items:center;font-family:var(--fh);font-weight:700;font-size:20px;color:#fff;text-shadow:1.5px 1.5px 0 var(--ink);box-shadow:var(--shs);flex:none}
.axe{border:2px solid var(--ink);border-left:8px solid var(--bf);background:#ffe8ee;border-radius:12px;padding:6px 10px;margin:6px 0;font-size:14px}
.hist{margin-top:12px;border-top:2.5px dashed var(--ink);padding-top:8px}
.hist .h{display:flex;align-items:center;gap:6px;padding:5px 6px;font-size:14px;border-radius:10px}
.hist .h:hover{background:var(--soft)}
.hist .h span{flex:1}
.empty{text-align:center;padding:40px;color:var(--mute)}

/* ---------- Obs layout ---------- */
.banner{background:#fff;border-bottom:3px solid var(--ink);padding:6px 16px 8px}
.banner .bt{font-family:var(--fh);font-size:15px;color:#d61f55;letter-spacing:.02em}
.axgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:8px;margin-top:4px}
.banner .ax{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:5px 8px 5px 10px;border:2px solid var(--ink);border-radius:14px;background:#fff0f4}
.banner .ax{flex-wrap:nowrap}
.banner .ax .txt{flex:1;min-width:0;font-size:14px;line-height:1.3}
.banner .ax .txt .chip{display:block;width:max-content;max-width:100%;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.banner .ax .seg button{padding:3px 8px;font-size:12px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff;box-shadow:var(--shs)}
.seg button{border:0;border-radius:0;min-height:32px;padding:3px 10px;font-size:12.5px;border-right:2px solid var(--ink);box-shadow:none}
.seg button:hover{transform:none;box-shadow:none;background:var(--soft)}
.seg button:active{transform:none}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;padding:16px}
.nav{display:flex;flex-direction:column;gap:8px;padding:2px 6px 6px 2px}
.nav .it{display:flex;align-items:center;gap:8px;text-align:left;padding:8px 10px 8px 22px;justify-content:flex-start;white-space:normal;background:linear-gradient(90deg,var(--c,#c9ccd9) 0 12px,#fff 12px);position:relative}
.nav .it.on{background:var(--c,#c9ccd9);transform:translateX(4px);box-shadow:var(--sh)}
.nav .it .n{flex:1;line-height:1.2;font-family:var(--fh);font-weight:600;font-size:15.5px}
.nav .it small{display:block;font-family:"Nunito",sans-serif;font-size:11.5px;font-weight:700;opacity:.75}
.nav .it .cnt{font-size:12px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:0 7px;font-weight:800}
.nav hr{border:0;border-top:2.5px dashed var(--ink);margin:6px 0;opacity:.5}
.main{min-width:0;padding:2px 8px 90px 2px}
.fhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--c);border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:8px 12px;margin-bottom:8px}
.fhead h2{font-size:24px}
.fhead input.title{font-family:var(--fh);font-size:24px;font-weight:700;border-color:transparent;background:transparent;box-shadow:none;padding:2px 6px;width:auto;flex:1;min-width:200px}
.fhead input.title:hover{border-color:var(--ink);background:rgba(255,255,255,.5)}
.timing{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;margin:0 0 0 14px}
.sec{background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);padding:14px;margin-bottom:16px;box-shadow:var(--sh);position:relative}
.sec>h4{display:inline-block;margin:-26px 0 8px -4px;font-family:var(--fh);font-weight:600;font-size:15px;background:var(--yellow);border:2px solid var(--ink);border-radius:10px;padding:1px 12px;transform:rotate(-2deg);box-shadow:var(--shs)}
.sec{margin-top:18px}
.kinds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.kinds button{min-height:36px;padding:3px 11px;font-size:13.5px;color:var(--kc);border-width:2px}
.kinds button.on{background:var(--kc);color:#fff;transform:translate(2px,2px);box-shadow:none}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1;min-width:220px}
.addrow select{width:auto;max-width:210px}
.items{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.item{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:14px;background:#fff;border:2px solid var(--ink);border-left:9px solid var(--k);box-shadow:var(--shs)}
.item .ic{font-size:18px;line-height:1.35}
.item .tx{flex:1;line-height:1.45;min-height:1.4em;white-space:pre-wrap}
.item select{width:auto;font-size:12px;padding:2px 4px;border-radius:8px;box-shadow:none}
.item.conseil{background:#e8f0ff;border-radius:20px 20px 20px 4px;border-left-width:2px}
.item button{min-height:28px;padding:0 8px}
.fgrid{display:block}
.drawph{width:100%;min-height:200px;border:3px dashed var(--ink);border-radius:16px;background:repeating-linear-gradient(45deg,#fff 0 12px,#fff8e1 12px 24px);font-family:var(--fh);font-size:20px;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.drawph span{font-size:44px}

/* ---------- Canvas ---------- */
.draw{position:relative;width:100%;aspect-ratio:1000/560;border:var(--bw) solid var(--ink);border-radius:14px;overflow:hidden;touch-action:none;background:#fff;box-shadow:var(--shs)}
.draw canvas{position:absolute;inset:0;width:100%;height:100%}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.sw{width:36px;height:36px;min-height:36px;border-radius:50%;padding:0;border:2.5px solid var(--ink)}
.sw.on{transform:scale(1.15);box-shadow:0 0 0 3px var(--yellow),0 0 0 5px var(--ink)}
.sw.on:hover{transform:scale(1.15)}
.tools .sz.on,.tools .tl.on{background:var(--accent);color:#fff}
.tools select{width:auto;min-height:34px;padding:3px 8px;font-size:13px}

/* ---------- Competences ---------- */
.compgrid{display:grid;grid-template-columns:1fr;gap:10px}
.comp{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;padding:10px;border:2px solid var(--ink);border-radius:14px;background:#fff;box-shadow:var(--shs)}
.comp.set{background:#fffbea}
.comp .code{font-family:var(--fh);font-weight:700;background:var(--yellow);border:2px solid var(--ink);border-radius:10px;padding:1px 8px;text-align:center;min-width:52px}
.comp .lab{font-size:14px;line-height:1.3}
.comp .lv{grid-column:1/-1;justify-self:start}
.comp .ev{grid-column:1/-1;font-size:12.5px;color:var(--mute)}
.comp input{grid-column:1/-1;padding:6px 9px;font-size:14px}
.lv button.on[data-l="1"]{background:#e53935;color:#fff}
.lv button.on[data-l="2"]{background:#f07a1a;color:#fff}
.lv button.on[data-l="3"]{background:#1fa463;color:#fff}
.lv button.on[data-l="0"]{background:#9aa0b8;color:#fff}
.group{grid-column:1/-1;margin-top:10px;font-family:var(--fh);font-weight:600;font-size:16px}
.sgrid{display:block}
.axcard{border:var(--bw) solid var(--ink);border-left:10px solid var(--bf);border-radius:16px;padding:10px 12px;margin-bottom:10px;background:#fff;box-shadow:var(--shs)}

/* ---------- Drawer / modal / bubble ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:#fff;z-index:40;border-left:3px solid var(--ink);box-shadow:-8px 0 0 rgba(31,37,68,.18);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .25s}
.drawer.open{transform:none}
.drawer .dh{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:3px solid var(--ink);background:var(--yellow);font-family:var(--fh);font-size:17px}
.drawer iframe{flex:1;border:0;width:100%}
.modalbg{position:fixed;inset:0;background:rgba(43,32,120,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;backdrop-filter:blur(2px)}
.modal{background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:7px 7px 0 var(--ink);max-width:680px;width:100%;padding:20px 22px;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.modal h2{margin-bottom:6px;font-size:26px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fab{position:fixed;right:20px;bottom:38px;z-index:30;width:68px;height:68px;border-radius:50%;font-size:30px;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);box-shadow:var(--sh);padding:0}
.fab:hover{background:#ffe066;transform:rotate(-8deg) scale(1.05)}
.bubble{position:fixed;right:22px;bottom:122px;z-index:31;width:min(470px,calc(100vw - 40px));max-height:74vh;background:#fff;border:3px solid var(--ink);border-radius:24px 24px 6px 24px;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;animation:pop .18s ease-out}
.bubble::after{content:"";position:absolute;right:16px;bottom:-20px;width:26px;height:20px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);clip-path:polygon(0 0,100% 0,100% 100%);transform:skewX(-20deg)}
.bubble .bh{padding:12px 14px;background:#e8f0ff;border-bottom:3px solid var(--ink);border-radius:21px 21px 0 0;font-family:var(--fh);font-size:18px}
.bubble .bh input{font-family:"Nunito",sans-serif;font-size:14px}
.bubble .bl{overflow:auto;padding:10px 12px;flex:1}
.bubble .cs{padding:8px 10px;border-radius:14px;border:2px solid var(--ink);margin-bottom:8px;font-size:14px;display:flex;gap:8px;align-items:flex-start;background:#fff;box-shadow:var(--shs)}
.bubble .cs span{flex:1}
.bubble .themes{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.bubble .themes button{min-height:28px;padding:1px 9px;font-size:12px;border-width:2px;box-shadow:none;font-family:"Nunito",sans-serif}
.bubble .themes button.on{background:var(--conseil);color:#fff}
.sign{position:fixed;right:12px;bottom:6px;z-index:29;font-size:12px;color:var(--mute);pointer-events:none;letter-spacing:.02em;background:rgba(255,246,229,.9);padding:1px 8px;border-radius:8px;border:1.5px solid rgba(31,37,68,.25)}
.sign b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;z-index:60;font-size:14px;font-weight:800;box-shadow:4px 4px 0 var(--yellow);animation:pop .18s ease-out}
.setgrid{display:grid;grid-template-columns:1fr;gap:18px}
.setgrid .card h3{font-size:20px;margin-bottom:4px}

/* ---------- Briques ---------- */
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;font-weight:700;margin:4px 0 8px 6px;align-items:center}
.legend i,.prev i{display:inline-block;width:18px;height:11px;border:1.5px solid var(--ink);border-radius:3px;vertical-align:middle;margin-right:5px}
.prev{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:3px;align-items:center;font-size:12px;color:var(--mute)}
.prev i{margin:0}
.prev span{margin-left:6px}
.brick{grid-column:1/-1;display:flex;gap:6px;align-items:center;background:var(--pc);border:2px solid var(--ink);border-radius:9px;padding:3px 4px;box-shadow:var(--shs)}
.brick .pal{min-height:30px;padding:0 8px;font-size:12.5px;border-width:2px;box-shadow:none;background:#fff;font-family:var(--fh)}
.brick .bt{flex:1;font-size:14px;line-height:1.35;min-height:1.3em}
.brick button.sm{min-height:28px}
.addb{grid-column:1/-1;display:flex;gap:5px;align-items:center}
.comp .addb input{flex:1;min-width:0;padding:6px 9px;font-size:14px}
.pb{min-height:36px;width:38px;padding:0;background:var(--pc);font-family:var(--fh);font-size:16px}
.ev{display:flex;flex-wrap:wrap}
.evb{min-height:0;padding:2px 8px;font-size:12px;border-width:1.5px;box-shadow:none;font-weight:600;white-space:normal;text-align:left;margin:2px 4px 0 0;background:#f6f7fb}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:30px 16px;align-items:end;margin-top:8px}
.wcol{display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.stack{display:flex;flex-direction:column-reverse;gap:3px}
.wb{width:calc(100% - 12px);text-align:left;white-space:normal;background:var(--pc);border:2px solid var(--ink);border-radius:7px;padding:4px 7px;min-height:0;font-size:12px;font-weight:700;line-height:1.25;box-shadow:2px 2px 0 var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wb.off{margin-left:12px}
.wb b{font-family:var(--fh)}
.wb.on{outline:3px solid var(--accent);outline-offset:2px}
.ground{border-top:6px solid var(--ink);margin-top:5px;padding-top:6px;text-align:center}
.ground .code{display:inline-block;font-family:var(--fh);font-weight:700;background:var(--yellow);border:2px solid var(--ink);border-radius:10px;padding:0 10px}
.ground small{font-size:11.5px;color:var(--mute);line-height:1.25;margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.flag{text-align:center;font-family:var(--fh);font-size:14px;margin-bottom:5px}
.wcol.vide .ground{opacity:.45}
.bsel{margin-bottom:20px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;background:var(--pc)}
.stat.p{background:var(--pc)}

/* ---------- Transfert QR ---------- */
.modal.wide{max-width:980px}
.sendgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:start}
.sendgrid .qr-box img{width:min(400px,56vh,80vw)}
@media (max-width:820px),(orientation:portrait){ .sendgrid{grid-template-columns:1fr} }
.qr-box{display:flex;flex-direction:column;align-items:center;gap:8px}
.qr-box img{width:min(440px,58vh,84vw);height:auto;image-rendering:pixelated;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:var(--sh)}
.qr-part{font-family:var(--fh);font-weight:700;font-size:20px}
.qr-nums{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.qr-nums button{min-width:40px;min-height:34px;padding:2px 8px;font-size:13px}
.qr-nums button.on{background:var(--accent);color:#fff}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
label.btn{display:inline-flex;align-items:center;cursor:pointer;border:var(--bw) solid var(--ink);background:#fff;border-radius:14px;padding:7px 14px;min-height:42px;font-weight:800;box-shadow:var(--shs);text-transform:none;font-family:"Nunito",sans-serif;font-size:15px;color:var(--ink);letter-spacing:0;margin:0}
.btn.orange{background:var(--yellow)}
.center{text-align:center}
.scan-wrap{position:relative;max-width:560px;margin:0 auto;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:4/3;border:3px solid var(--ink);box-shadow:var(--sh)}
.scan-wrap video{width:100%;height:100%;object-fit:cover;display:block}
.scan-frame{position:absolute;inset:8%;border:5px solid var(--yellow);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.scan-prog{position:relative;height:30px;background:var(--soft);border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.scan-bar{position:absolute;left:0;top:0;bottom:0;background:var(--sit)}
.scan-prog span{position:relative;display:block;text-align:center;font-weight:900;line-height:26px}

/* ---------- Paysage / grand écran : on exploite la largeur ---------- */
@media (min-width:1000px){
  .fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:18px;align-items:start}
  .fgrid>.col{min-width:0}
  .fgrid>.col.right{position:sticky;top:0}
  .compgrid{grid-template-columns:1fr 1fr}
  .sgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
  .setgrid{grid-template-columns:1fr 1fr}
  .setgrid .full{grid-column:1/-1}
  .fgrid textarea[data-k="f.text"]{min-height:150px}
}
@media (min-width:900px) and (orientation:landscape){
  .obsapp{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  .obsapp .top{position:relative}
  .obsapp .layout{flex:1;min-height:0;padding-bottom:0}
  .obsapp .nav,.obsapp .main{overflow:auto;min-height:0;overscroll-behavior:contain}
  .obsapp .main{padding-top:14px}
  .obsapp .nav{padding-top:6px;padding-bottom:40px}
}
@media (min-width:1400px){
  .layout{grid-template-columns:260px minmax(0,1fr)}
  .compgrid{grid-template-columns:1fr 1fr 1fr}
}
@media (max-width:1180px){ .top .lbl{display:none} .brand small{display:none} }
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:8px}
  .nav .it{min-width:160px}
  .nav .it.on{transform:translateY(-2px)}
  .nav hr{display:none}
  .nav>.row{min-width:220px}
  .banner .ax{flex-wrap:wrap}
  .two{grid-template-columns:1fr}
  .chrono .t{font-size:22px;min-width:76px}
  .axgrid{grid-template-columns:1fr}
  .hero svg{display:none}
  .wrap{padding:16px}
}

  #app,.fab,.bubble,.sign,.drawer,.modalbg,.toast{display:none!important}

}

.p-foot{margin-top:18px;display:flex;justify-content:space-between;font-size:9pt;color:#64748b;border-top:1px solid #cbd5e1;padding-top:6px}

<body>
<script src="lib/qrcode.js"></script>
<script src="lib/jsQR.js"></script>
<script src="lib/zxing-reader.js"></script>
<script src="lib/neps-qr.js"></script>
<div id="app"></div>
<div id="print"></div>
<div class="sign">N'EPS · by <b>Quentin Delisle</b></div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden">
<input type="file" id="pktFile" accept=".json,.neps,application/json" class="hidden">

<script>
/* =========================================================
   N'EPS · Visites stagiaires — by Quentin Delisle
   Données stockées localement (localStorage) — export JSON possible
   ========================================================= */
const LS = 'neps-stagiaires-v1';

const TYPES = {
  pem:    {l:'Prise en main',        c:'var(--pem)',    hex:'#7c6cf2', r:0},
  echauf: {l:'Échauffement',         c:'var(--echauf)', hex:'#ffb020', r:1},
  sit:    {l:'Situation de travail', c:'var(--sit)',    hex:'#1fc28b', r:2},
  bi:     {l:'Bilan intermédiaire',  c:'var(--bi)',     hex:'#2fb5f0', r:3},
  bf:     {l:'Bilan final',          c:'var(--bf)',     hex:'#ff4f7b', r:4},
};
const KINDS = {
  obs:     {l:'Observation', ic:'📝', c:'#64748b'},
  fort:    {l:'Point fort',  ic:'✅', c:'#16a34a'},
  vig:     {l:'Vigilance',   ic:'⚠️', c:'#ea580c'},
  secu:    {l:'Sécurité',    ic:'🛑', c:'#dc2626'},
  conseil: {l:'Conseil',     ic:'💡', c:'#2563eb'},
};
const LEVELS = ['Non observé','À construire','En cours','Acquis'];
const LV_COL = ['#64748b','#dc2626','#ea580c','#16a34a'];
const AX_STATUS = ['À observer','Non travaillé','En progrès','Atteint'];
const PAL = [{l:'Palier non précisé',c:'#e3e5ee'},{l:'Palier 1',c:'#ffb3a7'},{l:'Palier 2',c:'#ffd43b'},{l:'Palier 3',c:'#7cd4f5'},{l:'Palier 4',c:'#5fd39a'}];
const APP_ID = 'neps-stagiaires';

const DEFAULT_REF = `## Compétences communes à tous les professeurs et personnels d'éducation
CC1 | Faire partager les valeurs de la République
CC2 | Inscrire son action dans le cadre des principes fondamentaux du système éducatif et dans le cadre réglementaire de l'école
CC3 | Connaître les élèves et les processus d'apprentissage
CC4 | Prendre en compte la diversité des élèves
CC5 | Accompagner les élèves dans leur parcours de formation
CC6 | Agir en éducateur responsable et selon des principes éthiques
CC7 | Maîtriser la langue française à des fins de communication
CC8 | Utiliser une langue vivante étrangère dans les situations exigées par son métier
CC9 | Intégrer les éléments de la culture numérique nécessaires à l'exercice de son métier
CC10 | Coopérer au sein d'une équipe
CC11 | Contribuer à l'action de la communauté éducative
CC12 | Coopérer avec les parents d'élèves
CC13 | Coopérer avec les partenaires de l'école
CC14 | S'engager dans une démarche individuelle et collective de développement professionnel
## Compétences communes à tous les professeurs
P1 | Maîtriser les savoirs disciplinaires et leur didactique
P2 | Maîtriser la langue française dans le cadre de son enseignement
P3 | Construire, mettre en œuvre et animer des situations d'enseignement et d'apprentissage prenant en compte la diversité des élèves
P4 | Organiser et assurer un mode de fonctionnement du groupe favorisant l'apprentissage et la socialisation des élèves
P5 | Évaluer les progrès et les acquisitions des élèves`;

const DEFAULT_CONSEILS = [
  ['Organisation','Anticipe au maximum l\'installation du matériel pour te libérer du « temps de cerveau » et sortir du rôle de prof organisateur.'],
  ['Organisation','Fais installer le matériel pendant l\'échauffement par un ou plusieurs élèves, en faisant tourner les rôles : tu gagnes du temps.'],
  ['Organisation','Décale les groupes dans le temps : un groupe installe pendant que l\'autre s\'échauffe, puis donne les consignes au groupe prêt.'],
  ['Consignes','Lance un groupe dès que sa consigne est donnée, avant d\'expliquer la tâche suivante à l\'autre groupe : évite les temps de flottement.'],
  ['Consignes','Sanctuarise une zone de transmission des consignes (ex. devant le miroir, au bord du bassin) : un lieu = un moment d\'écoute.'],
  ['Consignes','Ajuste la complexité des consignes et du vocabulaire à la capacité d\'écoute des élèves. Commence par le nouveau, pas par ce qu\'ils connaissent déjà.'],
  ['Consignes','Pendant que tu parles, regarde les élèves : pas seulement pour voir s\'ils écoutent, mais pour vérifier qu\'ils comprennent.'],
  ['Consignes','Montre tes attendus par une démonstration : un élève pratiquant, un élève observateur.'],
  ['Voix / placement','Place ta voix et resserre le groupe lors des regroupements, surtout dans un milieu bruyant (piscine, gymnase).'],
  ['Sécurité','Anticipe les comportements des élèves : que se passe-t-il si tous les groupes chutent en même temps ? Gère l\'espace entre les ateliers.'],
  ['Sécurité','Donne aux pareurs des contenus d\'action précis et des règles générales, pas seulement un rôle.'],
  ['Rôles sociaux','Donne un support et de l\'importance aux observateurs/juges : cela engage les élèves dans la tâche. Et exploite leurs retours.'],
  ['Rôles sociaux','Sur ta fiche, indique ce que tu veux réellement voir et organise le dispositif pour cet objectif : comment regarder, quoi regarder, comment noter.'],
  ['Contenus','L\'échauffement est une occasion majeure de donner du contenu moteur et de préparer spécifiquement à la situation.'],
  ['Gestion de classe','Prends en charge le vestiaire : c\'est un temps fort pour réguler et rassurer.'],
  ['Bilan','Termine toujours par un passage devant au moins un petit public : engager les élèves dans un processus de démonstration.'],
  ['Bilan','Explique le POURQUOI des contenus : à quoi ça sert, en quoi c\'est essentiel pour le champ d\'apprentissage.'],
  ['Co-intervention','En co-intervention, répartissez-vous les rôles (contenus / ambiance et recueil de données) pour être tous deux concernés par l\'évènement.'],
];

/* ---------- Utils ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ms => { ms=Math.max(0,ms||0); const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0'); };
const fmtShort = ms => { const s=Math.round((ms||0)/1000); return Math.floor(s/60)+"'"+String(s%60).padStart(2,'0'); };
const frDate = d => d ? new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}) : '';
const shortDate = d => d ? new Date(d+'T12:00').toLocaleDateString('fr-FR') : '';
const today = () => new Date().toISOString().slice(0,10);
const firstName = n => (n||'').trim().split(/\s+/)[0]||'';
function toast(msg){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

const MASCOT = (w=96)=>`<svg width="${w}" height="${w}" viewBox="0 0 100 100" aria-hidden="true"><rect x="42" y="4" width="16" height="10" rx="3" fill="#ffd43b" stroke="#1f2544" stroke-width="3"/><line x1="78" y1="22" x2="86" y2="14" stroke="#1f2544" stroke-width="5" stroke-linecap="round"/><circle cx="50" cy="56" r="38" fill="#fff" stroke="#1f2544" stroke-width="4"/><circle cx="50" cy="56" r="30" fill="#e8f0ff"/><circle cx="38" cy="50" r="5" fill="#1f2544"/><circle cx="62" cy="50" r="5" fill="#1f2544"/><circle cx="40" cy="48" r="1.6" fill="#fff"/><circle cx="64" cy="48" r="1.6" fill="#fff"/><path d="M36 64 Q50 78 64 64" fill="none" stroke="#1f2544" stroke-width="4" stroke-linecap="round"/><circle cx="29" cy="62" r="5" fill="#ff9fb6"/><circle cx="71" cy="62" r="5" fill="#ff9fb6"/><line x1="50" y1="26" x2="50" y2="34" stroke="#1f2544" stroke-width="4" stroke-linecap="round"/></svg>`;
const AV_COL=['#7c6cf2','#ffb020','#1fc28b','#2fb5f0','#ff4f7b','#f07a1a','#a855f7'];
const avatar = n => { const ini=(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); let h=0; for(const c of n||'') h=(h*31+c.charCodeAt(0))>>>0; return `<div class="av" style="background:${AV_COL[h%AV_COL.length]}">${esc(ini)}</div>`; };

/* ---------- State ---------- */
function seed(){
  return {
    v:1,
    settings:{ tutor:'Quentin Delisle', school:'Lycée Monge La Chauvinière — Nantes', edtUrl:'https://quentindelisle.github.io/EDT/', ref:DEFAULT_REF },
    conseils: DEFAULT_CONSEILS.map(([theme,text])=>({id:uid(),theme,text})),
    trainees:[], obs:[]
  };
}
function load(){ try{ const j=localStorage.getItem(LS); return j?JSON.parse(j):null; }catch(e){ return null; } }
let S = load() || seed();
function migrate(){
  S.trainees.forEach(t=>{ if(!t.u) t.u=1; });
  S.obs.forEach(o=>{
    if(!o.bricks){ o.bricks=[]; Object.entries(o.comps||{}).forEach(([code,v])=>{ if(v.lvl>0||v.note) o.bricks.push({id:uid(),comp:code,text:v.note||LEVELS[v.lvl]||'',p:Math.min(4,v.lvl||0)}); }); }
    if(!o.u) o.u=Date.parse(o.created)||1;
    o.frames.forEach(f=>{ if(!f.strokes) f.strokes=[]; });
  });
}
migrate();
if(S.settings && !S.settings.edtUrl){ S.settings.edtUrl='https://quentindelisle.github.io/EDT/'; }
let saveT=null;
function save(now,noTouch){
  if(!noTouch && view==='obs'){ const o=O(); if(o) o.u=Date.now(); }
  clearTimeout(saveT);
  const go=()=>{ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){ toast('⚠️ Stockage plein : exporte puis supprime d\'anciennes visites.'); } };
  now?go():saveT=setTimeout(go,300);
}
function refList(){
  const out=[]; let g='';
  (S.settings.ref||'').split('\n').forEach(l=>{
    l=l.trim(); if(!l) return;
    if(l.startsWith('##')){ g=l.replace(/^#+\s*/,''); return; }
    const [code,...rest]=l.split('|'); if(!rest.length) return;
    out.push({code:code.trim(),label:rest.join('|').trim(),group:g});
  });
  return out;
}
const compLabel = code => { const c=refList().find(x=>x.code===code); return c?c.label:''; };
const compOptions = (sel,empty='Compétence…') => `<option value="">${empty}</option>`+refList().map(c=>`<option value="${esc(c.code)}" ${c.code===sel?'selected':''}>${esc(c.code)} — ${esc(c.label.slice(0,60))}${c.label.length>60?'…':''}</option>`).join('');

const trainee = id => S.trainees.find(t=>t.id===id);
const visitKey = o => (o.date||'')+(o.created||'');
function bricksOf(tid, upto){
  const res=[];
  S.obs.filter(o=>o.traineeId===tid && (!upto || visitKey(o)<=visitKey(upto))).sort((a,b)=>visitKey(a).localeCompare(visitKey(b)))
    .forEach(o=>(o.bricks||[]).forEach(b=>res.push({...b,o})));
  return res;
}
const hasDraw = f => !!(f.drawing || (f.strokes&&f.strokes.length));
const obsOf = tid => S.obs.filter(o=>o.traineeId===tid).sort((a,b)=>(b.date+b.created).localeCompare(a.date+a.created));
function currentAxes(tid, exceptId){
  const last = obsOf(tid).find(o=>o.id!==exceptId && (o.final?.axes||[]).some(a=>a.text.trim()));
  if(last) return {from:`${last.apsa||''} L${last.lesson||'?'} du ${shortDate(last.date)}`, axes:last.final.axes.filter(a=>a.text.trim())};
  const t=trainee(tid); return {from:'fixés manuellement', axes:(t?.axes||[]).filter(a=>a.text.trim())};
}

/* ---------- UI state ---------- */
let axFold=false, wallT=null, wallFrom='home', wallAll=false, wallSel=null, view='home', cur=null, curFrame=null, kind='obs', bubbleOpen=false, bubbleTheme='', bubbleQ='', measureStart=null;
const O = () => S.obs.find(o=>o.id===cur);
const F = () => O()?.frames.find(f=>f.id===curFrame);

/* ---------- Chrono ---------- */
function elapsed(o){ o=o||O(); if(!o) return 0; const c=o.chrono; return c.acc + (c.startedAt? Date.now()-c.startedAt : 0); }
setInterval(()=>{
  const o=O(); if(!o||view!=='obs') return;
  const t=$('#chronoT'); if(t) t.textContent=fmt(elapsed(o));
  const m=$('#measureBtn'); if(m&&measureStart!==null) m.textContent='⏹ '+fmtShort(elapsed(o)-measureStart);
  const tm=$('#timing'); if(tm) tm.innerHTML=timingHTML(F());
},500);

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  const a=$('#app');
  if(view==='home') a.innerHTML=homeHTML();
  else if(view==='settings') a.innerHTML=settingsHTML();
  else if(view==='wall') a.innerHTML=wallHTML();
  else if(view==='obs'){ if(!O()){view='home';return render();} a.innerHTML=obsHTML(); afterObsRender(); }
  renderBubble();
}

/* ---------- HOME ---------- */
function homeHTML(){
  const ts=S.trainees;
  return `
  <div class="top">
    <div class="brand"><img src="icons/logo-64.png" alt="">N'EPS <small>· Visites stagiaires</small></div>
    <div class="grow"></div>
    ${S.settings.edtUrl?`<button data-act="edt">📅 EDT</button>`:''}
    <button data-act="receive" title="Recevoir depuis un autre appareil">📥 <span class="lbl">Recevoir</span></button>
    <button data-act="newTrainee">＋ Stagiaire</button>
    <button data-act="settings">⚙︎ <span class="lbl">Paramètres</span></button>
  </div>
  <div class="wrap">
    <div class="hero">
      ${MASCOT(84)}
      <div class="grow"><h2>Mes stagiaires</h2><p class="muted">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})} · prêt pour une visite ?</p></div>
      <div class="stats"><div class="stat"><b>${ts.length}</b><span>stagiaire${ts.length>1?'s':''}</span></div><div class="stat"><b>${S.obs.length}</b><span>visite${S.obs.length>1?'s':''}</span></div></div>
      <button class="pri" style="min-height:52px;font-size:17px" data-act="newObs" ${ts.length?'':'disabled'}>▶ Nouvelle visite</button>
    </div>
    ${ts.length?`<div class="grid">${ts.map(tcardHTML).join('')}</div>`:
      `<div class="card empty">${MASCOT(110)}<h3 style="margin:10px 0">Aucun stagiaire pour l'instant</h3><button class="pri" data-act="newTrainee">＋ Ajouter un stagiaire</button></div>`}
    <p class="muted" style="font-size:12px;margin-top:30px;text-align:center">Données enregistrées sur cet appareil uniquement · pense à exporter régulièrement (Paramètres)</p>
  </div>`;
}
function tcardHTML(t){
  const ca=currentAxes(t.id); const list=obsOf(t.id); const nb=list.reduce((n,o)=>n+(o.bricks||[]).length,0);
  return `<div class="card tcard">

function palLegend(){ return `<div class="legend">${PAL.slice(1).map(p=>`<span><i style="background:${p.c}"></i>${p.l}</span>`).join('')}<span><i style="background:${PAL[0].c}"></i>non précisé</span></div>`; }
function brickHTML(b,i){ return `<div class="brick" style="--pc:${PAL[b.p||0].c}"><button class="pal" data-act="cycPal" data-i="${i}" title="Changer le palier">${b.p?'P'+b.p:'P ?'}</button><div class="bt" contenteditable="true" data-k="br.text:${i}">${esc(b.text)}</div><button class="ghost danger sm" data-act="delBrick" data-i="${i}" title="Retirer la brique">✕</button></div>`; }
function compHTML(o){
  const ev={}; o.frames.forEach(f=>f.items.forEach(it=>{ if(it.comp)(ev[it.comp]=ev[it.comp]||[]).push(it); }));
  const before={}; bricksOf(o.traineeId,o).filter(b=>b.o.id!==o.id).forEach(b=>(before[b.comp]=before[b.comp]||[]).push(b));
  const mine={}; (o.bricks||[]).forEach((b,i)=>(mine[b.comp]=mine[b.comp]||[]).push([b,i]));
  let g='', h=`<div class="fhead" style="--c:#ffd43b"><h2 class="grow">🧱 Briques de la leçon</h2><button data-act="wall" data-id="${o.traineeId}">🏗️ Voir le mur</button></div>
  <p class="muted" style="margin:6px 0 2px 6px;font-size:13px">Pour chaque compétence travaillée, écris ce qui a été construit puis touche le palier <b>1 2 3 4</b> : la brique s'ajoute au mur du stagiaire (Entrée = palier non précisé). Touche « P » sur une brique pour changer son palier. Les commentaires liés à la compétence sont proposés en dessous.</p>
  ${palLegend()}<div class="compgrid">`;
  refList().forEach(c=>{
    if(c.group!==g){ g=c.group; h+=`<div class="group">${esc(g)}</div>`; }
    const m=mine[c.code]||[], bf=before[c.code]||[], e=ev[c.code]||[];
    h+=`<div class="comp ${m.length?'set':''}"><div class="code">${esc(c.code)}</div><div class="lab">${esc(c.label)}</div>
      ${bf.length?`<div class="prev">${bf.map(b=>`<i style="background:${PAL[b.p||0].c}" title="L${esc(b.o.lesson||'?')} · ${esc(b.text)}"></i>`).join('')}<span>${bf.length} brique${bf.length>1?'s':''} déjà posée${bf.length>1?'s':''}</span></div>`:''}
      ${m.map(([b,i])=>brickHTML(b,i)).join('')}
      <div class="addb"><input data-bin="${esc(c.code)}" placeholder="Ce qui a été travaillé…" enterkeyhint="done">
        ${[1,2,3,4].map(p=>`<button class="pb" style="--pc:${PAL[p].c}" data-act="addBrick" data-c="${esc(c.code)}" data-p="${p}" title="Poser une brique — ${PAL[p].l}">${p}</button>`).join('')}</div>
      ${e.length?`<div class="ev">${e.map(it=>`<button class="evb" data-act="evBrick" data-c="${esc(c.code)}" data-t="${esc(it.text)}" title="Reprendre ce commentaire comme brique">${KINDS[it.kind].ic} ${esc(it.text)}</button>`).join('')}</div>`:''}
    </div>`;
  });
  return h+'</div>';
}

        <p style="font-size:17px;margin:8px 0">${esc(sel.text)||'<i class="muted">sans texte</i>'}</p>

function buildWallPrint(){

/* ---------- Drawing ---------- */
let undoStack=[];
function drawBg(ctx,type){
  const W=1000,H=560; ctx.clearRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  ctx.lineWidth=2;
  if(type==='grid'){ ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=1; for(let x=0;x<=W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();} for(let y=0;y<=H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();} }
  if(type==='gym'){ ctx.fillStyle='#fef3c7'; ctx.fillRect(0,0,W,H); ctx.strokeStyle='#92400e'; ctx.lineWidth=3; ctx.strokeRect(40,40,W-80,H-80); ctx.beginPath(); ctx.moveTo(W/2,40); ctx.lineTo(W/2,H-40); ctx.stroke(); ctx.beginPath(); ctx.arc(W/2,H/2,70,0,7); ctx.stroke(); }
  if(type==='pool'){ ctx.fillStyle='#bae6fd'; ctx.fillRect(0,40,W,H-80); ctx.fillStyle='#e2e8f0'; ctx.fillRect(0,0,W,40); ctx.fillRect(0,H-40,W,40); const lh=(H-80)/6; for(let i=1;i<6;i++){ const y=40+i*lh; ctx.setLineDash([14,10]); ctx.strokeStyle='#dc2626'; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); } ctx.setLineDash([]); ctx.fillStyle='#0369a1'; ctx.font='bold 20px system-ui'; for(let i=0;i<6;i++) ctx.fillText(String(i+1),10,40+i*lh+lh/2+7); }
}
const LEG={};
function legacyImg(f){ if(!f.drawing) return null; let im=LEG[f.id];
  if(!im||im._src!==f.drawing){ im=new Image(); im._src=f.drawing; im.onload=()=>{ if(F()===f){ const c=$('#inkC'); c&&paintAll(c.getContext('2d'),f); } }; im.src=f.drawing; LEG[f.id]=im; }
  return im.complete&&im.naturalWidth?im:null; }
function strokeStyle(ctx,s){ ctx.globalCompositeOperation=s.t==='e'?'destination-out':'source-over'; ctx.strokeStyle=ctx.fillStyle=s.c; ctx.lineWidth=s.t==='e'?s.w*5:s.w; ctx.lineCap='round'; ctx.lineJoin='round'; }
function paintStroke(ctx,s){
  strokeStyle(ctx,s); const p=s.p;
  if(s.t==='a') arrow(ctx,{x:p[0],y:p[1]},{x:p[2],y:p[3]});
  else if(p.length<=2){ ctx.beginPath(); ctx.arc(p[0],p[1],ctx.lineWidth/2,0,7); ctx.fill(); }
  else { ctx.beginPath(); ctx.moveTo(p[0],p[1]); for(let i=2;i<p.length;i+=2) ctx.lineTo(p[i],p[i+1]); ctx.stroke(); }
  ctx.globalCompositeOperation='source-over';
}
function paintAll(ctx,f,extra){ ctx.clearRect(0,0,1000,560); const im=legacyImg(f); if(im) ctx.drawImage(im,0,0); (f.strokes||[]).forEach(s=>paintStroke(ctx,s)); if(extra) paintStroke(ctx,extra); }
function setupCanvas(){
  const f=F(); const bg=$('#bgC'), ink=$('#inkC'); if(!bg||!ink||!f) return;
  drawBg(bg.getContext('2d'),f.bg||'blank');
  const ctx=ink.getContext('2d'); f.strokes=f.strokes||[]; paintAll(ctx,f);
  let cur=null;
  const pos=e=>{ const r=ink.getBoundingClientRect(); return [Math.round((e.clientX-r.left)*1000/r.width), Math.round((e.clientY-r.top)*560/r.height)]; };
  ink.onpointerdown=e=>{ ink.setPointerCapture(e.pointerId); const p=pos(e);
    cur={t:pen.tool==='arrow'?'a':pen.tool==='eraser'?'e':'p', c:pen.c, w:pen.w, p:pen.tool==='arrow'?[p[0],p[1],p[0],p[1]]:p};
    if(cur.t!=='a') paintStroke(ctx,cur); };
  ink.onpointermove=e=>{ if(!cur) return; const p=pos(e);
    if(cur.t==='a'){ cur.p[2]=p[0]; cur.p[3]=p[1]; paintAll(ctx,f,cur); return; }
    const n=cur.p.length, lx=cur.p[n-2], ly=cur.p[n-1]; if(Math.abs(p[0]-lx)+Math.abs(p[1]-ly)<3) return;
    strokeStyle(ctx,cur); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p[0],p[1]); ctx.stroke(); ctx.globalCompositeOperation='source-over';
    cur.p.push(p[0],p[1]); };
  const end=()=>{ if(!cur) return; const c=cur; cur=null;
    if(c.t==='a'&&Math.hypot(c.p[2]-c.p[0],c.p[3]-c.p[1])<8){ paintAll(ctx,f); return; }
    f.strokes.push(c); save(); refreshNav(); };
  ink.onpointerup=end; ink.onpointercancel=end; ink.onpointerleave=e=>{ if(e.pointerType==='mouse') end(); };
}
function arrow(ctx,a,b){ ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); const ang=Math.atan2(b.y-a.y,b.x-a.x), L=10+ctx.lineWidth*3; ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-L*Math.cos(ang-0.45),b.y-L*Math.sin(ang-0.45)); ctx.lineTo(b.x-L*Math.cos(ang+0.45),b.y-L*Math.sin(ang+0.45)); ctx.closePath(); ctx.fill(); }
async function composite(f){
  const c=document.createElement('canvas'); c.width=1000; c.height=560; const x=c.getContext('2d'); drawBg(x,f.bg||'blank');
  const k=document.createElement('canvas'); k.width=1000; k.height=560; const kx=k.getContext('2d');
  if(f.drawing) await new Promise(r=>{ const im=new Image(); im.onload=()=>{ kx.drawImage(im,0,0); r(); }; im.onerror=r; im.src=f.drawing; });
  (f.strokes||[]).forEach(s=>paintStroke(kx,s)); x.drawImage(k,0,0);
  return c.toDataURL('image/jpeg',.85);
}

/* =========================================================
   RATTRAPAGE DU TEMPS (chrono oublié / phase commencée plus tôt)
   ========================================================= */
const MIN=60000;
const clockAt = msAgo => new Date(Date.now()-msAgo).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
/* décale tout le chronométrage de d ms : le chrono avance, les phases gardent leurs heures réelles */
function addChrono(o,d){
  if(d<0) d=-Math.min(-d, Math.min(elapsed(o), ...o.frames.filter(x=>x.start!=null).map(x=>x.start)));
  o.chrono.acc+=d; o.frames.forEach(x=>{ if(x.start!=null) x.start+=d; if(x.end!=null) x.end+=d; });
  return d;
}
function setPhaseStart(o,f,ns){
  if(!o.chrono.startedAt) o.chrono.startedAt=Date.now();
  if(ns<0) ns+=addChrono(o,-ns);            // pas assez de chrono : on l'avance d'autant
  const now=elapsed(o); ns=Math.max(0,Math.min(ns,now));
  if(f.start==null) f.end=null;
  const wasNew=f.start==null||f.end!=null;
  o.frames.forEach(x=>{ if(x===f||x.start==null) return;
    if(x.start<ns && (x.end==null || x.end>ns)) x.end=ns;       // la phase précédente s'arrête au nouveau début
    else if(wasNew && x.end==null) x.end=now; });                // une seule phase en cours à la fois
  f.start=ns; if(f.end!=null && f.end<ns) f.end=ns;
  f.clock=clockAt(now-ns);
}
function minsPicker(list,act,extra=''){ return `<div class="mins">${list.map(m=>`<button data-m="${m}" data-x="${act}">${m>0&&act!=='ago'?'+':''}${m===0?'maintenant':m+' min'}</button>`).join('')}${extra}</div>`; }

function packetFor(obsList, trs){
  let dropped=0;
  const o=JSON.parse(JSON.stringify(obsList)); o.forEach(x=>x.frames.forEach(f=>{ delete f.showDraw; if(f.drawing){ dropped++; delete f.drawing; } }));
  const p={a:APP_ID,v:1,d:Date.now(),t:JSON.parse(JSON.stringify(trs.filter(Boolean))),o};
  if(S.settings.ref!==DEFAULT_REF) p.ref=S.settings.ref;
  return [p,dropped];
}
async function sendPacket(obsList, trs, title, fname){
  const [p,dropped]=packetFor(obsList,trs);
  const parts=chunkQR(await encodePacket(p),'V');
  const bg=sheet(`<div class="sendgrid"><div class="qrzone"></div><div>
    <h2>📤 ${esc(title)}</h2>

    ${dropped?`<p>⚠️ ${dropped} ancien${dropped>1?'s':''} croquis (format image) ne voyage${dropped>1?'nt':''} pas par QR : utilise l'envoi en fichier.</p>`:''}
    <p class="muted" style="margin-top:18px">Pas de caméra sur le PC ?</p>
    <button data-x="file">📁 Envoyer en fichier</button>

    </div></div>`);
  showQRSeries(parts,bg.querySelector('.qrzone'),'');
  bg.querySelector('[data-x=file]').onclick=()=>{ const [full]=packetFor(obsList,trs); full.o=JSON.parse(JSON.stringify(obsList)); downloadJSON(full,fname); };
}
function applyPacket(p){
  if(!p||p.a!==APP_ID){ toast('⚠️ Ce QR / fichier ne vient pas de l\'appli Visites stagiaires'); return false; }
  const idMap={}; let nt=0,no=0,nr=0,ns=0;
  (p.t||[]).forEach(t=>{ if(!t) return; let ex=trainee(t.id);
    if(!ex){ const same=S.trainees.find(x=>x.name.trim().toLowerCase()===(t.name||'').trim().toLowerCase()); if(same){ idMap[t.id]=same.id; ex=same; } }
    if(!ex){ S.trainees.push(t); nt++; } else if((t.u||0)>(ex.u||0)){ const keep=ex.id; Object.assign(ex,t,{id:keep}); } });
  (p.o||[]).forEach(o=>{ if(idMap[o.traineeId]) o.traineeId=idMap[o.traineeId];
    o.frames.forEach(f=>{ if(!f.strokes) f.strokes=[]; }); if(!o.bricks) o.bricks=[];
    const i=S.obs.findIndex(x=>x.id===o.id);
    if(i<0){ S.obs.push(o); no++; return; }
    const ex=S.obs[i];
    if((o.u||0)===(ex.u||0)){ ns++; return; }
    if((ex.u||0)>(o.u||0) && !confirm(`La visite « L${ex.lesson||'?'} ${ex.apsa||''} du ${shortDate(ex.date)} » a été modifiée plus récemment sur cet appareil.

La remplacer quand même par la version reçue ?`)){ ns++; return; }
    o.frames.forEach(f=>{ const ef=ex.frames.find(x=>x.id===f.id); if(ef&&ef.drawing&&!f.drawing) f.drawing=ef.drawing; });
    S.obs[i]=o; nr++; });
  if(p.ref && p.ref!==S.settings.ref && confirm('Le référentiel de compétences de l\'autre appareil est différent. Le reprendre sur celui-ci ?')) S.settings.ref=p.ref;
  save(true,true);
  const msg=[no&&`${no} visite${no>1?'s':''} ajoutée${no>1?'s':''}`,nr&&`${nr} mise${nr>1?'s':''} à jour`,ns&&`${ns} déjà à jour ou gardée${ns>1?'s':''}`,nt&&`${nt} stagiaire${nt>1?'s':''} ajouté${nt>1?'s':''}`].filter(Boolean).join(' · ')||'Rien de nouveau';
  toast('📥 '+msg);
  const one=(p.o||[]).length===1 && (no||nr) ? p.o[0].id : null;
  if(one){ cur=one; curFrame=O().frames[0]?.id||'__synth'; view='obs'; } else if(view==='obs'&&!O()) view='home';
  render(); return true;
}
function addBrick(code,p){
  const inp=document.querySelector(`[data-bin="${CSS.escape(code)}"]`); const text=(inp?.value||'').trim();
  if(!text){ toast('Écris d\'abord ce qui a été travaillé'); inp&&inp.focus(); return; }
  O().bricks.push({id:uid(),comp:code,text,p}); save();
  keepScroll(refreshMain); toast(`🧱 Brique posée · ${code}${p?' · palier '+p:''}`);
  const n=document.querySelector(`[data-bin="${CSS.escape(code)}"]`); n&&n.focus({preventScroll:true});
}

  drive(){ const t=trainee(O().traineeId); openDrawer('Dossier Drive — '+t.name,t.drive); },
  edt(){ if(view==='obs') openDrawer('Emploi du temps',S.settings.edtUrl); else window.open(S.settings.edtUrl,'_blank'); },
  closeDrawer(){ $('#drawer').classList.remove('open'); $('#drawerF').src='about:blank'; },
  async pdf(){ await buildPrint(); setTimeout(()=>window.print(),150); },
  mail(){ const m=mailLink();
    const bg=modal(`<h2>✉️ Envoyer le bilan</h2>
      <p class="muted" style="font-size:14px">1. Génère le PDF (🖨 Bilan PDF → « Enregistrer au format PDF »).<br>2. Ouvre le mail pré-rempli et joins le PDF.</p>
      <label>Destinataire</label><input value="${esc(m.to)}" readonly><label>Objet</label><input value="${esc(m.subj)}" readonly>
      <label>Message</label><textarea readonly style="min-height:180px">${esc(m.body)}</textarea>
      <div class="row" style="margin-top:10px"><button data-act="pdf">🖨 Générer le PDF</button><a href="${m.href}"><button class="pri">Ouvrir dans ma messagerie</button></a><button id="cpy">Copier le texte</button></div>`,()=>true);
    bg.querySelector('#cpy').onclick=()=>{ navigator.clipboard?.writeText(m.body).then(()=>toast('Copié'),()=>toast('Copie impossible')); };
  },
  bubble(){ bubbleOpen=!bubbleOpen; renderBubble(); },
  bTheme(b){ bubbleTheme=b.dataset.t; renderBubble(); },
  insConseil(b){ const c=S.conseils.find(x=>x.id===b.dataset.id); if(c) insertConseil(c.text); },
  saveConseil(){ const t=$('#newC').value.trim(); if(!t) return; S.conseils.push({id:uid(),theme:$('#newCT').value.trim()||'Perso',text:t}); save(); renderBubble(); toast('Ajouté à la bibliothèque'); return t; },
  saveInsConseil(){ const t=ACT.saveConseil(); if(t) insertConseil(t); },
  delConseil(b){ S.conseils=S.conseils.filter(c=>c.id!==b.dataset.id); save(); render(); },
  resetRef(){ if(confirm('Rétablir le référentiel 2013 ?')){ S.settings.ref=DEFAULT_REF; save(); render(); } },
  export(){ const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`neps-stagiaires-${today()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); },
  import(){ $('#importFile').click(); },
  wipe(){ if(confirm('Effacer TOUTES les données de cet appareil ?')&&confirm('Vraiment ? Exporte d\'abord si besoin.')){ S=seed(); save(true); view='home'; render(); } },
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const f=ACT[b.dataset.act]; if(f) f(b,e);
});
function bindValue(el){
  const k=el.dataset.k; if(!k) return; const [key,arg]=k.split(':');
  const v = el.type==='checkbox'?el.checked : el.isContentEditable? el.innerText : el.value;
  const o=O(), f=F();
  switch(key){
    case 'set.tutor': S.settings.tutor=v; break;
    case 'set.school': S.settings.school=v; break;
    case 'set.edtUrl': S.settings.edtUrl=v.trim(); break;
    case 'set.ref': S.settings.ref=v; break;
    case 'f.title': f.title=v; refreshNav(); break;
    case 'f.text': f.text=v; break;
    case 'f.bg': f.bg=v; drawBg($('#bgC').getContext('2d'),v); break;
    case 'it.text': f.items[+arg].text=v; break;
    case 'it.comp': f.items[+arg].comp=v; break;
    case 'priv': o.private=v; break;
    case 'fin.synth': o.final.synth=v; break;
    case 'fin.forts': o.final.forts=v; break;
    case 'ax.text': o.final.axes[+arg].text=v; break;
    case 'ax.comp': o.final.axes[+arg].comp=v; break;
    case 'ax.prio': o.final.axes[+arg].prio=v; break;
    case 'br.text': o.bricks[+arg].text=v; break;
    case 'cmp.note': o.comps[arg]=o.comps[arg]||{lvl:0,note:''}; o.comps[arg].note=v; break;
  }
  save();
}
document.addEventListener('input',e=>bindValue(e.target));
document.addEventListener('change',e=>{ if(e.target.matches('select,input[type=checkbox]')) bindValue(e.target); });
$('#pktFile').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.a!==APP_ID) throw 0; const sh=document.querySelector('.modalbg'); sh&&sh.close&&sh.close(); applyPacket(d); }catch(_){ toast('Fichier non reconnu'); } };
  r.readAsText(file); e.target.value='';
});
$('#importFile').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.a===APP_ID){ applyPacket(d); return; } if(!d.trainees||!d.obs) throw 0; if(!confirm('Remplacer les données actuelles par ce fichier ?')) return; S=d; migrate(); save(true); view='home'; render(); toast('Import réussi'); }catch(_){ toast('Fichier invalide'); } };
  r.readAsText(file); e.target.value='';
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const sh=document.querySelector('.modalbg'); if(sh&&sh.close) sh.close(); if(bubbleOpen){bubbleOpen=false;renderBubble();} const d=$('#drawer'); d&&d.classList.remove('open'); } });
window.addEventListener('beforeprint',()=>{ if($('#print').innerHTML) return; if(view==='obs') buildPrint(); else if(view==='wall') buildWallPrint(); });
window.addEventListener('afterprint',()=>{ $('#print').innerHTML=''; });
window.addEventListener('pagehide',()=>save(true));

render();

/* ---------- PWA ---------- */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{ const w=reg.installing; w&&w.addEventListener('statechange',()=>{ if(w.state==='installed'&&navigator.serviceWorker.controller) toast('Nouvelle version disponible : recharge la page'); }); });
  }).catch(()=>{});
}
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; const top=document.querySelector('.top .grow'); if(view==='home'&&top&&!document.getElementById('instBtn')){ const b=document.createElement('button'); b.id='instBtn'; b.textContent='⤓ Installer'; b.onclick=async()=>{ installEvt.prompt(); await installEvt.userChoice; installEvt=null; b.remove(); }; top.after(b); } });
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
</script>
</body>
</html>
